<!doctype html>
<!--
  銷售數據 > 會員與顧客（前端範例，只用假資料，沒有接後端）

  直接用瀏覽器打開這個檔案就能看（要有網路，因為 Tailwind、Plotly 從 CDN 載入）。

  - 假資料有兩種，之後換成 Python 從資料庫查出來的 DataFrame：
      會員：members（id、created_at）+ member_profiles（name、gender、birthday）
      訂單：orders（member_id、status、subtotal - discount、created_at）
  - 消費金額跟營收總覽一樣：只算有效訂單（排除 UNPAID、CANCELLED），= subtotal - discount，不含運費
  - 依「下單時間 created_at」決定訂單屬於哪個期間
  - 年齡用 birthday 換算成「今天幾歲」，不是下單當時幾歲
  - 新客、回購客：只看這段期間有下單的會員
      新客：第一筆有效訂單在這段期間內（以前沒買過）
      回購客：這段期間之前就有有效訂單
  - Google 登入第一次只會建 members，補填完才有 member_profiles；沒補填的會員不能結帳，所以沒有性別、年齡
  - 點「性別」「年齡層」的長條可以篩選整頁，兩個可以同時選（篩選在前端做，不用重新呼叫後端）
      有篩選時，沒補填資料的會員不知道性別、年齡，所以不會算進新註冊會員
-->

    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>會員與顧客</title>
    <!-- 跟專案 frontend/index.html 一樣的 Tailwind 和字型 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style type="text/tailwindcss">
        @theme {
            --color-paper: #F6F5F2;
            --color-cream: #F0EBE3;
            --color-stone: #D9CFC7;
            --color-muted: #76716c;
            --color-line: #dfd9d2;
            --font-kinu: 'DM Sans', 'Noto Sans TC', sans-serif;
        }
    </style>
    <style>
        /* 圖表用的顏色，集中放這裡方便之後換 */
        :root {
            --series-current: #2a78d6;   /* 長條的顏色 */
            --series-track: #e8eef7;     /* 排行長條的底色 */
            --series-faded: #c5d9f2;     /* 還沒過完的月份；有篩選時，沒被選到的長條 */
        }
        /* 性別、年齡層的長條可以點：游標改成手指（Plotly 預設是十字） */
        .clickable-chart .nsewdrag {
            cursor: pointer !important;
        }
    </style>
</head>

<script>
    // ==================== 假資料 ====================
    // 之後這一段整個換成呼叫 Python 的 API，例如 fetch('/api/admin/sales/members?range=30d')

    const RANGE_OPTIONS = [
        { key: '7d', name: '近 7 天', days: 7, start: '2026/10/20' },
        { key: '30d', name: '近 30 天', days: 30, start: '2026/09/27' },
        { key: '90d', name: '近 90 天', days: 90, start: '2026/07/29' },
        { key: '12m', name: '近 12 個月', days: 365, start: '2025/10/27' },
    ];
    const END_DATE = '2026/10/26';
    const TOTAL_DAYS = 800;  // 假資料共幾天；要比 12 個月長，才有「之前就買過」的回購客

    // 時間用「第幾天」表示：0 = 假資料第一天的 00:00，TOTAL_DAYS = 現在（2026/10/27 00:00）
    const NOW = TOTAL_DAYS;

    // 第幾天 → 日期（new Date 的「日」超出範圍會自動進位，例如 10 月 -5 日 = 9 月 25 日）
    function dayToDate(day) {
        return new Date(2026, 9, 27 - TOTAL_DAYS + Math.floor(day));
    }

    // 固定種子的亂數，每次打開數字都一樣，方便對照
    let seed = 20261027;
    function random() {
        seed = (seed * 16807) % 2147483647;
        return seed / 2147483647;
    }

    // 照比例隨機挑一個，例如 pick({ male: 40, female: 60 })
    function pick(weightMap) {
        const total = Object.values(weightMap).reduce((sum, weight) => sum + weight, 0);
        let r = random() * total;
        for (const [key, weight] of Object.entries(weightMap)) {
            r -= weight;
            if (r < 0) return key;
        }
        return Object.keys(weightMap)[0];
    }

    const SURNAME_LIST = ['陳', '林', '黃', '張', '李', '王', '吳', '劉', '蔡', '楊', '許', '鄭', '謝', '郭', '洪'];
    const GIVEN_NAME_LIST = ['怡君', '雅婷', '家豪', '志明', '淑芬', '冠宇', '佳穎', '承恩', '詩涵', '宗翰', '欣怡', '俊傑', '思妤', '柏翰', '品妍'];

    // 會員（members + member_profiles）
    const allMemberList = [];
    // 訂單（orders 的一列，只放這頁用得到的欄位）
    const allOrderList = [];

    for (let day = 0; day < TOTAL_DAYS; day++) {
        // 越後面註冊的人越多，再加上一點隨機起伏
        const count = Math.round(3 + day / TOTAL_DAYS * 5 + random() * 5);
        for (let i = 0; i < count; i++) {
            const id = allMemberList.length + 1;
            const createdAt = day + random();
            // 約 8% 用 Google 登入後還沒補填資料：沒有 profile，也就不能下單
            const hasProfile = random() > 0.08;
            const gender = pick({ male: 38, female: 62 });
            const age = Number(pick({ 18: 6, 23: 20, 28: 22, 33: 18, 38: 13, 43: 9, 48: 6, 55: 6 })) + Math.floor(random() * 5);
            const birthday = `${2026 - age}-${String(1 + Math.floor(random() * 12)).padStart(2, '0')}-${String(1 + Math.floor(random() * 28)).padStart(2, '0')}`;

            allMemberList.push({
                id: id,
                createdAt: createdAt,
                profile: hasProfile ? {
                    name: SURNAME_LIST[Math.floor(random() * SURNAME_LIST.length)]
                        + GIVEN_NAME_LIST[Math.floor(random() * GIVEN_NAME_LIST.length)],
                    gender: gender,
                    birthday: birthday,
                } : null,
            });

            // 下單：25% 從來沒買過；有買的人每買一次，有 45% 不會再回來
            // 每個人回購的間隔不一樣（20 ~ 120 天左右）
            if (!hasProfile || random() < 0.25) continue;
            const gapDays = 20 + random() * 100;
            // 30 ~ 44 歲的人每筆買得多一點
            const spendLevel = (age >= 30 && age < 45 ? 1.25 : 1) * (0.6 + random() * 0.8);
            let orderAt = createdAt + random() * 20;
            while (orderAt < NOW) {
                allOrderList.push({
                    memberId: id,
                    status: pick({ DELIVERED: 86, SHIPPED: 6, CANCELLED: 6, UNPAID: 2 }),
                    amount: Math.round((490 + random() * 2600) * spendLevel / 10) * 10,  // subtotal - discount
                    createdAt: orderAt,
                });
                if (random() < 0.45) break;
                orderAt += gapDays * (0.5 + random());
            }
        }
    }

    // 模擬 API：回傳這段期間下的訂單（依 created_at）
    function fakeApi(range) {
        return allOrderList.filter(order => order.createdAt >= NOW - range.days);
    }

    // ==================== 畫面 ====================

    const style = getComputedStyle(document.documentElement);
    const COLOR_BAR = style.getPropertyValue('--series-current').trim();
    const COLOR_FADED = style.getPropertyValue('--series-faded').trim();

    const GENDER_LABEL = { female: '女性', male: '男性' };
    // 年齡層：min 歲 ~ max 歲（含）
    const AGE_GROUP_LIST = [
        { name: '24 歲以下', min: 0, max: 24 },
        { name: '25 – 34 歲', min: 25, max: 34 },
        { name: '35 – 44 歲', min: 35, max: 44 },
        { name: '45 歲以上', min: 45, max: 999 },
    ];
    const MEASURE_OPTIONS = [
        { key: 'amount', name: '消費金額' },
        { key: 'buyers', name: '下單人數' },
    ];

    let currentRange = RANGE_OPTIONS[1];
    let measure = 'amount';  // 性別、年齡層圖要看哪個數字
    let filterGender = null;  // 篩選的性別：null = 不篩選、'female'、'male'
    let filterAge = null;     // 篩選的年齡層：null = 不篩選，或 AGE_GROUP_LIST 裡的其中一個

    // 點性別、年齡層：點同一個就取消，否則換成這個
    function clickGender(gender) {
        filterGender = filterGender === gender ? null : gender;
        render();
    }

    function clickAge(group) {
        filterAge = filterAge === group ? null : group;
        render();
    }

    // 用 id 找會員（pandas 會直接 merge orders 和 members）
    const memberMap = new Map(allMemberList.map(member => [member.id, member]));

    // 有效訂單：排除未付款、已取消（跟營收總覽一樣的定義）
    function isValid(order) {
        return order.status !== 'UNPAID' && order.status !== 'CANCELLED';
    }

    // 每個會員「第一筆有效訂單」的時間，用全部訂單算，不受期間影響
    // pandas：valid_df.groupby('member_id')['created_at'].min()
    const firstOrderAtMap = new Map();
    for (const order of allOrderList.filter(isValid)) {
        const first = firstOrderAtMap.get(order.memberId);
        if (first === undefined || order.createdAt < first) firstOrderAtMap.set(order.memberId, order.createdAt);
    }

    // 生日 → 今天幾歲（還沒過今年生日就要減 1）
    // 注意：SQL Server 的 DATEDIFF(YEAR, birthday, GETDATE()) 只是年份相減，沒過生日也會多算 1 歲
    function ageOf(birthday) {
        const [year, month, day] = birthday.split('-').map(Number);
        const today = { year: 2026, month: 10, day: 26 };
        const hadBirthday = today.month > month || (today.month === month && today.day >= day);
        return today.year - year - (hadBirthday ? 0 : 1);
    }

    // 這個會員屬於哪個年齡層
    function ageGroupOf(member) {
        const age = ageOf(member.profile.birthday);
        return AGE_GROUP_LIST.find(group => age >= group.min && age <= group.max);
    }

    // 有沒有符合篩選條件；沒補填資料的會員不知道性別、年齡，有篩選時一律不符合
    function matchGender(member) {
        return !filterGender || (member.profile !== null && member.profile.gender === filterGender);
    }

    function matchAge(member) {
        return !filterAge || (member.profile !== null && ageGroupOf(member) === filterAge);
    }

    function matchFilter(member) {
        return matchGender(member) && matchAge(member);
    }

    function formatNumber(n) {
        return n.toLocaleString('zh-TW');
    }

    function formatMoney(n) {
        return `NT$ ${formatNumber(Math.round(n))}`;
    }

    function formatPercent(part, total) {
        return total === 0 ? '—' : `${(part / total * 100).toFixed(1)}%`;
    }

    // 一組切換按鈕
    function renderToggle(boxId, optionList, currentKey, onChange) {
        const box = document.getElementById(boxId);
        box.innerHTML = '';
        for (const option of optionList) {
            const button = document.createElement('button');
            button.type = 'button';
            button.textContent = option.name;
            button.className = 'px-4 py-2 text-[12px] tracking-[.06em] '
                + (option.key === currentKey ? 'bg-black text-white' : 'text-muted hover:text-[#111]');
            button.onclick = () => onChange(option.key);
            box.appendChild(button);
        }
    }

    // 篩選條件列：有篩選時顯示「女性 ✕」「25 – 34 歲 ✕」和清除按鈕
    function renderFilterBar() {
        const bar = document.getElementById('filter-bar');
        if (!filterGender && !filterAge) {
            bar.innerHTML = `<span class="text-muted">目前顯示全部會員。點下方「性別」「年齡層」的長條，整頁會跟著篩選</span>`;
            return;
        }
        const chipList = [];
        if (filterGender) chipList.push({ id: 'filter-gender', name: GENDER_LABEL[filterGender] });
        if (filterAge) chipList.push({ id: 'filter-age', name: filterAge.name });
        bar.innerHTML = `
            <span class="text-muted">篩選中：</span>
            ${chipList.map(chip => `
            <span class="flex items-center gap-2 border border-black bg-white px-3 py-1.5 text-[#111]">
                ${chip.name}
                <button type="button" id="${chip.id}" aria-label="取消篩選" class="text-muted hover:text-[#111]">✕</button>
            </span>`).join('')}
            <button type="button" id="filter-clear" class="text-muted underline underline-offset-4 hover:text-[#111]">清除篩選</button>`;
        if (filterGender) document.getElementById('filter-gender').onclick = () => clickGender(filterGender);
        if (filterAge) document.getElementById('filter-age').onclick = () => clickAge(filterAge);
        document.getElementById('filter-clear').onclick = () => {
            filterGender = null;
            filterAge = null;
            render();
        };
    }

    // 依會員加總：每個有下單的會員一列（pandas：valid_df.groupby('member_id').agg(...)）
    // 回傳 [{ member, orderCount, amount, isNew }]
    function sumByMember(orderList, periodStart) {
        const rowMap = new Map();
        for (const order of orderList.filter(isValid)) {
            if (!rowMap.has(order.memberId)) {
                rowMap.set(order.memberId, {
                    member: memberMap.get(order.memberId),
                    orderCount: 0,
                    amount: 0,
                    isNew: firstOrderAtMap.get(order.memberId) >= periodStart,
                });
            }
            const row = rowMap.get(order.memberId);
            row.orderCount++;
            row.amount += order.amount;
        }
        return [...rowMap.values()];
    }

    function renderKpiCards(buyerList, periodStart) {
        const newCount = buyerList.filter(row => row.isNew).length;
        const signupList = allMemberList.filter(member => member.createdAt >= periodStart && matchFilter(member));

        const cardList = [
            { name: '下單會員數', value: formatNumber(buyerList.length), note: '這段期間有有效訂單的會員' },
            { name: '新客', value: formatNumber(newCount), note: `佔下單會員 ${formatPercent(newCount, buyerList.length)}` },
            {
                name: '回購客',
                value: formatNumber(buyerList.length - newCount),
                note: `佔下單會員 ${formatPercent(buyerList.length - newCount, buyerList.length)}`,
            },
            { name: '新註冊會員', value: formatNumber(signupList.length), note: '這段期間註冊的會員' },
        ];
        document.getElementById('kpi-cards').innerHTML = cardList.map(card => `
            <div class="border border-line bg-white p-6 max-[760px]:p-4">
                <div class="text-[12px] tracking-[.08em] text-muted">${card.name}</div>
                <div class="mt-2 text-[28px] font-semibold tracking-[.02em]">${card.value}</div>
                <div class="mt-1 text-[12px] tracking-[.04em] text-muted">${card.note}</div>
            </div>`).join('');
    }

    function renderBuyerTable(buyerList) {
        const totalAmount = buyerList.reduce((sum, row) => sum + row.amount, 0);
        const groupList = [
            { name: '新客', rowList: buyerList.filter(row => row.isNew) },
            { name: '回購客', rowList: buyerList.filter(row => !row.isNew) },
        ];
        document.getElementById('buyer-rows').innerHTML = groupList.map(group => {
            const amount = group.rowList.reduce((sum, row) => sum + row.amount, 0);
            return `
            <tr class="border-b border-line last:border-b-0">
                <td class="py-2.5 pr-4">${group.name}</td>
                <td class="py-2.5 pr-4 text-right">${formatNumber(group.rowList.length)}</td>
                <td class="py-2.5 pr-4 text-right">${formatPercent(group.rowList.length, buyerList.length)}</td>
                <td class="py-2.5 pr-4 text-right">${formatMoney(amount)}</td>
                <td class="py-2.5 pr-4 text-right">${formatPercent(amount, totalAmount)}</td>
                <td class="py-2.5 text-right font-medium">${group.rowList.length === 0 ? '—' : formatMoney(amount / group.rowList.length)}</td>
            </tr>`;
        }).join('');
    }

    // Plotly 共用的版面設定（Python 的 fig.update_layout(...) 可以設一樣的東西）
    function baseLayout() {
        return {
            margin: { l: 16, r: 16, t: 8, b: 32 },
            paper_bgcolor: '#fff',
            plot_bgcolor: '#fff',
            font: { family: "'DM Sans', 'Noto Sans TC', sans-serif", size: 12, color: '#76716c' },
            hoverlabel: { bgcolor: '#fff', bordercolor: '#dfd9d2', font: { color: '#111' } },
            showlegend: false,
            dragmode: false,
        };
    }

    const PLOTLY_CONFIG = { displayModeBar: false, responsive: true };

    // 把下單會員依某個分組加總；getKey 回傳這個會員屬於哪一組
    // 回傳跟 keyList 同順序的 [{ buyers, amount }]
    function sumByGroup(buyerList, keyList, getKey) {
        return keyList.map(key => {
            const rowList = buyerList.filter(row => getKey(row.member) === key);
            return { buyers: rowList.length, amount: rowList.reduce((sum, row) => sum + row.amount, 0) };
        });
    }

    // 橫條圖；labelList 由上往下排。長條長度看目前選的數字（消費金額或下單人數），hover 顯示全部
    // colorList：每條長條的顏色（篩選時用來把沒選到的變淡）
    function drawGroupChart(elementId, labelList, groupList, colorList) {
        const valueList = groupList.map(group => group[measure]);
        const total = valueList.reduce((sum, n) => sum + n, 0);
        const traces = [{
            // 橫條圖由下往上畫，所以反過來，第一個才會在最上面
            x: valueList.slice().reverse(),
            y: labelList.slice().reverse(),
            type: 'bar',
            orientation: 'h',
            marker: { color: colorList.slice().reverse() },
            text: valueList.map(n => `${measure === 'amount' ? formatMoney(n) : `${formatNumber(n)} 人`}（${formatPercent(n, total)}）`).reverse(),
            textposition: 'outside',
            cliponaxis: false,
            customdata: groupList.map(group => [
                formatMoney(group.amount),
                formatNumber(group.buyers),
                group.buyers === 0 ? '—' : formatMoney(group.amount / group.buyers),
            ]).reverse(),
            hovertemplate: '%{y}<br>消費金額 %{customdata[0]}<br>下單人數 %{customdata[1]} 人<br>平均每人 %{customdata[2]}<extra></extra>',
        }];
        const layout = baseLayout();
        layout.bargap = 0.4;
        layout.margin.r = 170;  // 留空間給長條右邊的字
        layout.margin.b = 8;
        layout.xaxis = { showticklabels: false, showgrid: false, zeroline: false };
        layout.yaxis = { automargin: true, linecolor: '#dfd9d2' };
        Plotly.react(elementId, traces, layout, PLOTLY_CONFIG);
    }

    // 兩張圖自己都是篩選器：性別圖只套用年齡層的篩選，年齡層圖只套用性別的篩選
    // 這樣選了「女性」之後，性別圖還是看得到男性，年齡層圖則變成「女性的年齡分布」
    function renderGenderAge(buyerList) {
        renderToggle('measure-buttons', MEASURE_OPTIONS, measure, key => {
            measure = key;
            render();
        });

        const genderKeyList = Object.keys(GENDER_LABEL);
        drawGroupChart('gender-chart',
            genderKeyList.map(key => GENDER_LABEL[key]),
            sumByGroup(buyerList.filter(row => matchAge(row.member)), genderKeyList, member => member.profile.gender),
            genderKeyList.map(key => (!filterGender || key === filterGender) ? COLOR_BAR : COLOR_FADED));

        // pandas：pd.cut(df['age'], bins=[0, 24, 34, 44, 999])
        drawGroupChart('age-chart',
            AGE_GROUP_LIST.map(group => group.name),
            sumByGroup(buyerList.filter(row => matchGender(row.member)), AGE_GROUP_LIST, ageGroupOf),
            AGE_GROUP_LIST.map(group => (!filterAge || group === filterAge) ? COLOR_BAR : COLOR_FADED));
    }

    // Top 10：名次 + 姓名 + 長條。長條長度 = 跟第 1 名比的比例
    function renderTopList(buyerList) {
        // df.nlargest(10, 'amount')
        const topList = buyerList.slice().sort((a, b) => b.amount - a.amount).slice(0, 10);
        if (topList.length === 0) {
            document.getElementById('top-list').innerHTML =
                `<li class="py-6 text-center text-[13px] text-muted">這段期間沒有會員下單</li>`;
            return;
        }
        const max = topList[0].amount;
        document.getElementById('top-list').innerHTML = topList.map((row, index) => {
            const profile = row.member.profile;
            const tag = row.isNew ? '新客' : '回購客';
            return `
            <li class="flex items-center gap-4 border-b border-line py-3 last:border-b-0">
                <span class="w-6 text-right text-[14px] font-semibold tabular-nums ${index < 3 ? '' : 'text-muted'}">${index + 1}</span>
                <div class="min-w-0 flex-1">
                    <div class="flex items-center text-[13px] tracking-[.04em]">
                        <span class="truncate">${profile.name}</span>
                        <span class="ml-2 border border-line px-1.5 py-0.5 text-[11px] text-muted">${tag}</span>
                    </div>
                    <div class="mt-0.5 text-[12px] tracking-[.04em] text-muted">
                        會員編號 ${row.member.id}・${GENDER_LABEL[profile.gender]}・${ageOf(profile.birthday)} 歲
                    </div>
                    <div class="mt-1.5 h-1.5 w-full rounded-full" style="background: var(--series-track)">
                        <div class="h-1.5 rounded-full" style="width: ${row.amount / max * 100}%; background: var(--series-current)"></div>
                    </div>
                </div>
                <div class="w-[120px] shrink-0 text-right tabular-nums max-[560px]:w-[96px]">
                    <div class="text-[14px] font-semibold">${formatMoney(row.amount)}</div>
                    <div class="text-[12px] text-muted">${formatNumber(row.orderCount)} 筆訂單</div>
                </div>
            </li>`;
        }).join('');
    }

    // 每月新註冊會員數：固定看最近 12 個月，不受上面的期間影響，但會套用性別、年齡層的篩選
    // SQL：GROUP BY YEAR(created_at), MONTH(created_at)；本月還沒過完，用淡色
    function renderSignup() {
        const lastDate = dayToDate(NOW - 1);
        const monthList = [];
        for (let i = 11; i >= 0; i--) {
            const date = new Date(lastDate.getFullYear(), lastDate.getMonth() - i, 1);
            monthList.push({ year: date.getFullYear(), month: date.getMonth() + 1, count: 0 });
        }
        for (const member of allMemberList.filter(matchFilter)) {
            const date = dayToDate(member.createdAt);
            const row = monthList.find(row => row.year === date.getFullYear() && row.month === date.getMonth() + 1);
            if (row) row.count++;
        }

        document.getElementById('signup-note').textContent =
            `最近 12 個月，依註冊時間（members.created_at），不受上方期間影響。${lastDate.getMonth() + 1} 月只算到 ${END_DATE}，所以比較少`
            + (filterGender || filterAge ? '。有篩選時不含還沒補填資料的會員' : '');
        const traces = [{
            x: monthList.map(row => `${row.year}/${String(row.month).padStart(2, '0')}`),
            y: monthList.map(row => row.count),
            type: 'bar',
            marker: { color: monthList.map((row, index) => index === monthList.length - 1 ? COLOR_FADED : COLOR_BAR) },
            text: monthList.map(row => formatNumber(row.count)),
            textposition: 'outside',
            cliponaxis: false,
            hovertemplate: '%{x}<br>%{y:,} 位新會員<extra></extra>',
        }];
        const layout = baseLayout();
        layout.bargap = 0.35;
        layout.margin.t = 24;
        layout.xaxis = { type: 'category', showgrid: false, linecolor: '#dfd9d2' };
        layout.yaxis = { showticklabels: false, showgrid: false, zeroline: false };
        Plotly.react('signup-chart', traces, layout, PLOTLY_CONFIG);
    }

    function render() {
        const periodStart = NOW - currentRange.days;
        const buyerList = sumByMember(fakeApi(currentRange), periodStart);
        // 篩選後的資料：除了性別、年齡層圖（它們是篩選器），其他區塊都用這份
        // pandas：df[(df['gender'] == 'female') & (df['age_group'] == '25 – 34 歲')]
        const filteredList = buyerList.filter(row => matchFilter(row.member));

        document.getElementById('period-text').textContent =
            `${currentRange.start} ～ ${END_DATE}　・　依下單時間（created_at），只算有效訂單`;
        renderToggle('range-buttons', RANGE_OPTIONS, currentRange.key, key => {
            currentRange = RANGE_OPTIONS.find(range => range.key === key);
            render();
        });
        renderFilterBar();
        renderKpiCards(filteredList, periodStart);
        renderBuyerTable(filteredList);
        renderGenderAge(buyerList);
        renderTopList(filteredList);
        renderSignup();
    }

    render();

    // 點長條 → 篩選。圖第一次畫完之後才能綁事件，之後 Plotly.react 重畫也會保留
    // 長條的 y 是中文（女性 / 25 – 34 歲），換回 female / 年齡層
    document.getElementById('gender-chart').on('plotly_click', event => {
        const label = event.points[0].y;
        clickGender(Object.keys(GENDER_LABEL).find(key => GENDER_LABEL[key] === label));
    });
    document.getElementById('age-chart').on('plotly_click', event => {
        const label = event.points[0].y;
        clickAge(AGE_GROUP_LIST.find(group => group.name === label));
    });
</script>
</body>
</html>

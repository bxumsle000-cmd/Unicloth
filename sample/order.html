<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KINU 後台｜訂單物流</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- 跟前台 frontend/index.html 用同一套色票和字型 -->
    <style type="text/tailwindcss">
        @theme {
            --color-paper: #F6F5F2;
            --color-cream: #F0EBE3;
            --color-stone: #D9CFC7;
            --color-muted: #76716c;
            --color-line: #dfd9d2;
            --font-kinu: 'DM Sans', 'Noto Sans TC', sans-serif;
        }
    </style>
    <!-- 列印撿貨單時，只印撿貨單那一塊 -->
    <style>
        @media print {
            body * { visibility: hidden; }
            #pickModal, #pickModal * { visibility: visible; }
            #pickModal { position: absolute; inset: 0; background: #fff; }
            #pickModal .no-print { display: none; }
        }
    </style>
    <!-- 假資料 -->
    <script src="mock/orders.js"></script>
</head>
<body class="min-h-screen bg-paper font-kinu text-[#111]">

<div class="flex min-h-screen max-[760px]:flex-col">

    <!-- 左邊：側邊選單 -->
    <aside class="w-[220px] shrink-0 border-r border-line bg-white max-[760px]:w-full max-[760px]:border-r-0 max-[760px]:border-b">
        <div class="px-6 py-6 max-[760px]:py-4">
            <div class="text-[10px] tracking-[.22em] text-muted">KINU ADMIN</div>
            <div class="mt-1 text-[16px] font-medium tracking-[.08em]">訂單物流</div>
        </div>
        <nav id="sideMenu" class="flex flex-col pb-6 max-[760px]:flex-row max-[760px]:pb-0"></nav>
    </aside>

    <!-- 右邊：頂部列 + 內容區 -->
    <div class="flex min-w-0 flex-1 flex-col">
        <header class="flex items-center justify-end gap-4 border-b border-line bg-white px-8 py-4 max-[760px]:px-4">
            <span class="text-[12px] tracking-[.06em] text-muted">目前登入：<b id="currentUser" class="font-medium text-[#111]"></b></span>
            <a href="login.html" class="border border-line px-3 py-1.5 text-[12px] tracking-[.08em] hover:border-black">登出</a>
        </header>

        <main class="flex-1 px-8 py-8 max-[760px]:px-4">

            <!-- ========== 訂單列表 ========== -->
            <section id="page-orders">
                <div class="mb-6">
                    <div class="text-[10px] tracking-[.22em] text-muted">ORDERS</div>
                    <h1 class="text-[24px] font-medium tracking-[.08em]">訂單列表</h1>
                </div>

                <!-- 狀態分頁 -->
                <div id="stageTabs" class="mb-4 flex flex-wrap gap-0 border-b border-line"></div>
                <p id="stageHint" class="mb-4 text-[12px] tracking-[.04em] text-muted"></p>

                <!-- 篩選列 -->
                <div class="mb-4 flex flex-wrap items-center gap-3">
                    <input id="keyword" type="text" placeholder="訂單編號、收件人、電話"
                           class="w-[220px] border border-line bg-white px-3 py-2 text-[13px] outline-none focus:border-black max-[760px]:w-full">
                    <select id="shipFilter" class="border border-line bg-white px-3 py-2 text-[13px] outline-none focus:border-black">
                        <option value="">全部配送方式</option>
                        <option value="HOME">宅配</option>
                        <option value="CVS">超商取貨</option>
                    </select>
                    <select id="payFilter" class="border border-line bg-white px-3 py-2 text-[13px] outline-none focus:border-black">
                        <option value="">全部付款方式</option>
                        <option value="CREDIT">信用卡</option>
                        <option value="ATM">ATM 轉帳</option>
                        <option value="COD">貨到付款</option>
                    </select>
                    <span class="flex items-center gap-2 text-[12px] text-muted">
                        下單日期
                        <input id="dateFrom" type="date" class="border border-line bg-white px-2 py-1.5 text-[13px] text-[#111] outline-none focus:border-black">
                        ～
                        <input id="dateTo" type="date" class="border border-line bg-white px-2 py-1.5 text-[13px] text-[#111] outline-none focus:border-black">
                    </span>
                </div>

                <!-- 整批操作列 -->
                <div id="batchBar" class="mb-3 hidden flex-wrap items-center gap-2 border border-black bg-white px-4 py-3 text-[13px]">
                    <span class="mr-2">已選 <b id="batchCount" class="font-medium"></b> 筆</span>
                    <button data-batch="pick" class="border border-line px-3 py-1.5 text-[12px] hover:border-black">產生撿貨單</button>
                    <button data-batch="ship" class="border border-black bg-black px-3 py-1.5 text-[12px] text-white hover:opacity-80">標記已出貨</button>
                    <button data-batch="complete" class="border border-line px-3 py-1.5 text-[12px] hover:border-black">標記已送達／取貨完畢</button>
                    <button data-batch="clear" class="ml-auto text-[12px] text-muted hover:text-[#111]">取消選取</button>
                </div>
                <div id="batchResult" class="mb-3 hidden border border-[#b0413e] bg-white px-4 py-3 text-[13px]"></div>

                <div class="overflow-x-auto border border-line bg-white">
                    <table class="w-full min-w-[900px] text-left text-[13px]">
                        <thead class="border-b border-line bg-cream text-[11px] tracking-[.1em] text-muted">
                            <tr>
                                <th class="w-10 py-3 pl-4"><input id="selectAll" type="checkbox" class="accent-black" title="全選目前列表"></th>
                                <th class="px-4 py-3 font-medium">訂單編號</th>
                                <th class="px-4 py-3 font-medium">下單時間</th>
                                <th class="px-4 py-3 font-medium">收件人</th>
                                <th class="px-4 py-3 font-medium">配送</th>
                                <th class="px-4 py-3 font-medium">付款</th>
                                <th class="px-4 py-3 font-medium">金額</th>
                                <th class="px-4 py-3 font-medium">狀態</th>
                                <th class="px-4 py-3"></th>
                            </tr>
                        </thead>
                        <tbody id="orderRows"></tbody>
                    </table>
                </div>
                <p id="orderEmpty" class="hidden py-10 text-center text-[13px] text-muted">沒有符合條件的訂單</p>
            </section>

            <!-- ========== 付款紀錄（只能看） ========== -->
            <section id="page-payments" class="hidden">
                <div class="mb-6">
                    <div class="text-[10px] tracking-[.22em] text-muted">PAYMENTS</div>
                    <h1 class="text-[24px] font-medium tracking-[.08em]">付款紀錄</h1>
                    <p class="mt-2 text-[12px] tracking-[.04em] text-muted">綠界回傳的付款結果，只能查看。貨到付款不經過綠界，所以不會出現在這裡。</p>
                </div>
                <div class="mb-4 flex flex-wrap gap-3">
                    <input id="payKeyword" type="text" placeholder="訂單編號、交易編號"
                           class="w-[220px] border border-line bg-white px-3 py-2 text-[13px] outline-none focus:border-black max-[760px]:w-full">
                    <select id="payStatusFilter" class="border border-line bg-white px-3 py-2 text-[13px] outline-none focus:border-black">
                        <option value="">全部狀態</option>
                        <option value="PAID">付款成功</option>
                        <option value="PENDING">等待付款</option>
                        <option value="FAILED">付款失敗</option>
                        <option value="CANCELLED">已取消</option>
                    </select>
                </div>
                <div class="overflow-x-auto border border-line bg-white">
                    <table class="w-full min-w-[860px] text-left text-[13px]">
                        <thead class="border-b border-line bg-cream text-[11px] tracking-[.1em] text-muted">
                            <tr>
                                <th class="px-4 py-3 font-medium">建立時間</th>
                                <th class="px-4 py-3 font-medium">訂單編號</th>
                                <th class="px-4 py-3 font-medium">交易編號</th>
                                <th class="px-4 py-3 font-medium">綠界交易編號</th>
                                <th class="px-4 py-3 font-medium">方式</th>
                                <th class="px-4 py-3 font-medium">金額</th>
                                <th class="px-4 py-3 font-medium">狀態</th>
                                <th class="px-4 py-3 font-medium">付款時間</th>
                            </tr>
                        </thead>
                        <tbody id="paymentRows"></tbody>
                    </table>
                </div>
                <p id="paymentEmpty" class="hidden py-10 text-center text-[13px] text-muted">沒有符合條件的付款紀錄</p>
            </section>
        </main>
    </div>
</div>

<!-- ========== 訂單明細：從右邊滑出來的面板 ========== -->
<div id="drawer" class="fixed inset-0 z-40 hidden bg-black/40">
    <div class="absolute right-0 top-0 flex h-full w-full max-w-[560px] flex-col bg-white">
        <div class="flex items-center justify-between border-b border-line px-6 py-4">
            <div class="flex items-center gap-3">
                <h2 id="dTitle" class="text-[18px] font-medium tracking-[.06em]"></h2>
                <span id="dStage"></span>
            </div>
            <button id="drawerClose" class="text-[22px] leading-none text-muted hover:text-[#111]" title="關閉">×</button>
        </div>
        <div id="dActions" class="flex flex-wrap gap-2 border-b border-line px-6 py-3"></div>
        <div id="dBody" class="flex-1 overflow-y-auto px-6 py-5 text-[13px]"></div>
    </div>
</div>

<!-- ========== 取消訂單確認視窗 ========== -->
<div id="cancelModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 px-4">
    <div class="w-full max-w-[440px] bg-white px-7 py-7">
        <h2 class="mb-2 text-[18px] font-medium tracking-[.08em]">取消訂單</h2>
        <p id="cancelTarget" class="mb-4 text-[13px] text-muted"></p>
        <div id="cancelNotes" class="mb-4 flex flex-col gap-2 text-[13px]"></div>
        <label class="mb-6 flex items-center gap-2 text-[13px]">
            <input id="restoreStock" type="checkbox" checked class="accent-black"> 把訂單裡的商品庫存加回去
        </label>
        <div class="flex justify-end gap-2">
            <button id="cancelBack" class="border border-line px-4 py-2.5 text-[12px] tracking-[.12em] hover:border-black">不要取消</button>
            <button id="cancelConfirm" class="border border-[#b0413e] bg-[#b0413e] px-4 py-2.5 text-[12px] tracking-[.12em] text-white hover:opacity-80">確定取消訂單</button>
        </div>
    </div>
</div>

<!-- ========== 撿貨單 ========== -->
<div id="pickModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 px-4">
    <div class="flex max-h-[90vh] w-full max-w-[720px] flex-col bg-white">
        <div class="flex items-center justify-between border-b border-line px-6 py-4">
            <div>
                <h2 class="text-[18px] font-medium tracking-[.08em]">撿貨單</h2>
                <p id="pickInfo" class="mt-1 text-[12px] text-muted"></p>
            </div>
            <div class="no-print flex gap-2">
                <button id="pickPrint" class="border border-black bg-black px-4 py-2 text-[12px] tracking-[.12em] text-white hover:opacity-80">列印</button>
                <button id="pickClose" class="border border-line px-4 py-2 text-[12px] tracking-[.12em] hover:border-black">關閉</button>
            </div>
        </div>
        <div class="overflow-y-auto px-6 py-4">
            <p class="mb-3 text-[12px] text-muted">同一個貨號的數量已經加總，照貨號排序，方便在倉庫依序拿貨。</p>
            <table class="w-full text-left text-[13px]">
                <thead class="border-b border-line text-[11px] tracking-[.1em] text-muted">
                    <tr>
                        <th class="py-2 pr-3 font-medium">✓</th>
                        <th class="py-2 pr-3 font-medium">貨號</th>
                        <th class="py-2 pr-3 font-medium">商品</th>
                        <th class="py-2 pr-3 font-medium">顏色／尺寸</th>
                        <th class="py-2 pr-3 text-right font-medium">數量</th>
                        <th class="py-2 font-medium">訂單</th>
                    </tr>
                </thead>
                <tbody id="pickRows"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- 畫面下方的提示訊息 -->
<div id="toast" class="pointer-events-none fixed bottom-8 left-1/2 z-[60] -translate-x-1/2 bg-[#111] px-6 py-3 text-[13px] tracking-[.06em] text-white opacity-0 transition-opacity"></div>

<script>
    // ===== 資料與對照表 =====
    let orderList = window.MOCK_ORDERS;

    const SHIPPING = { HOME: '宅配', CVS: '超商取貨' };
    const PAYMENT = { CREDIT: '信用卡', ATM: 'ATM 轉帳', COD: '貨到付款' };
    const ORDER_STATUS = { PENDING: '訂單確認中', SHIPPED: '已出貨', DELIVERED: '已送達', PICKED_UP: '取貨完畢', CANCELLED: '已取消' };
    const PAY_STATUS = { PAID: '付款成功', PENDING: '等待付款', FAILED: '付款失敗', CANCELLED: '已取消' };

    // 資料庫的 status 只有 PENDING / SHIPPED / ...，但「PENDING」裡面還要分「還沒付錢」和「可以出貨」，
    // 所以畫面上用「階段」來分頁：信用卡、ATM 要付了款才能出貨；貨到付款不用等
    const STAGES = [
        { key: 'TO_SHIP',   name: '待出貨', hint: '已付款或貨到付款的訂單。最早下單的排最前面，請依序出貨。' },
        { key: 'UNPAID',    name: '待付款', hint: '信用卡或 ATM 還沒收到款，先不要出貨。付款成功後會自動移到「待出貨」。' },
        { key: 'SHIPPED',   name: '已出貨', hint: '已經交給物流，等宅配送達或客人到超商取貨。' },
        { key: 'DONE',      name: '已完成', hint: '宅配已送達或超商已取貨。' },
        { key: 'CANCELLED', name: '已取消', hint: '' },
        { key: 'ALL',       name: '全部',   hint: '' },
    ];

    function stageOf(o) {
        if (o.status === 'PENDING') return (o.paidAt || o.paymentMethod === 'COD') ? 'TO_SHIP' : 'UNPAID';
        if (o.status === 'SHIPPED') return 'SHIPPED';
        if (o.status === 'CANCELLED') return 'CANCELLED';
        return 'DONE'; // DELIVERED、PICKED_UP
    }

    const STAGE_STYLE = {
        TO_SHIP: 'border-black bg-black text-white', UNPAID: 'border-[#b07a2d] text-[#b07a2d]', SHIPPED: 'border-[#2d5f8a] text-[#2d5f8a]',
        DONE: 'border-[#2f6b3a] text-[#2f6b3a]', CANCELLED: 'border-line text-muted',
    };
    function stageBadge(o) {
        const stage = stageOf(o);
        // 已完成的再細分「已送達 / 取貨完畢」
        const text = stage === 'DONE' ? ORDER_STATUS[o.status] : STAGES.find(s => s.key === stage).name;
        return `<span class="inline-block border px-2 py-0.5 text-[11px] ${STAGE_STYLE[stage]}">${text}</span>`;
    }

    const MENU = [
        { key: 'orders',   name: '訂單列表' },
        { key: 'payments', name: '付款紀錄' },
    ];

    let me = 'order01';
    try { me = sessionStorage.getItem('adminUser') || 'order01'; } catch (e) {}
    document.getElementById('currentUser').textContent = me;

    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const money = n => 'NT$' + Number(n).toLocaleString();
    const findOrder = id => orderList.find(o => o.id == id);
    function nowText() {
        const d = new Date(), pad = n => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    // ===== 側邊選單 =====
    let currentPage = 'orders';
    function renderMenu() {
        const toShip = orderList.filter(o => stageOf(o) === 'TO_SHIP').length;
        $('sideMenu').innerHTML = '';
        MENU.forEach(item => {
            const b = document.createElement('button');
            b.type = 'button';
            const active = item.key === currentPage;
            b.className = 'flex items-center justify-between whitespace-nowrap px-6 py-3 text-left text-[13px] tracking-[.08em] border-l-2 max-[760px]:border-l-0 max-[760px]:border-b-2 max-[760px]:px-4 max-[760px]:gap-2 '
                + (active ? 'border-black bg-paper font-medium' : 'border-transparent text-muted hover:text-[#111]');
            b.innerHTML = esc(item.name) + (item.key === 'orders' && toShip ? `<span class="bg-black px-1.5 text-[11px] text-white">${toShip}</span>` : '');
            b.addEventListener('click', () => showPage(item.key));
            $('sideMenu').appendChild(b);
        });
    }
    function showPage(key) {
        currentPage = key;
        $('page-orders').classList.toggle('hidden', key !== 'orders');
        $('page-payments').classList.toggle('hidden', key !== 'payments');
        key === 'orders' ? renderOrders() : renderPayments();
        renderMenu();
    }

    // ===== 訂單列表 =====
    let currentStage = 'TO_SHIP';   // 物流每天最常看的是「待出貨」，所以預設這一頁
    let selectedIds = new Set();
    let visibleIds = [];

    function renderStageTabs() {
        $('stageTabs').innerHTML = STAGES.map(s => {
            const count = s.key === 'ALL' ? orderList.length : orderList.filter(o => stageOf(o) === s.key).length;
            const active = s.key === currentStage;
            return `<button data-stage="${s.key}" class="-mb-px border-b-2 px-4 py-2.5 text-[13px] tracking-[.06em] ${active ? 'border-black font-medium' : 'border-transparent text-muted hover:text-[#111]'}">
                ${s.name} <span class="ml-1 text-[11px] ${active ? '' : 'text-stone'}">${count}</span></button>`;
        }).join('');
        $('stageHint').textContent = STAGES.find(s => s.key === currentStage).hint;
    }

    function filteredOrders() {
        const kw = $('keyword').value.trim().toLowerCase();
        const ship = $('shipFilter').value, pay = $('payFilter').value;
        const from = $('dateFrom').value, to = $('dateTo').value;
        const rows = orderList.filter(o =>
            (currentStage === 'ALL' || stageOf(o) === currentStage) &&
            (!kw || o.orderNo.toLowerCase().includes(kw) || o.receiverName.includes(kw) || o.receiverPhone.replace(/-/g, '').includes(kw.replace(/-/g, ''))) &&
            (!ship || o.shippingMethod === ship) &&
            (!pay || o.paymentMethod === pay) &&
            (!from || o.createdAt.slice(0, 10) >= from) &&
            (!to || o.createdAt.slice(0, 10) <= to)
        );
        // 待出貨：舊的在前（先下單先出貨）；其他：新的在前
        return rows.sort((a, b) => currentStage === 'TO_SHIP' ? a.createdAt.localeCompare(b.createdAt) : b.createdAt.localeCompare(a.createdAt));
    }

    function renderOrders() {
        renderStageTabs();
        const rows = filteredOrders();
        $('orderRows').innerHTML = rows.map(o => `
            <tr class="border-b border-line last:border-b-0 ${selectedIds.has(o.id) ? 'bg-paper' : ''} ${o.status === 'CANCELLED' ? 'text-muted' : ''}">
                <td class="py-3 pl-4"><input type="checkbox" data-select="${o.id}" ${selectedIds.has(o.id) ? 'checked' : ''} class="accent-black"></td>
                <td class="px-4 py-3"><button data-open="${o.id}" class="underline-offset-2 hover:underline">${esc(o.orderNo)}</button></td>
                <td class="px-4 py-3 text-[12px] text-muted">${esc(o.createdAt)}</td>
                <td class="px-4 py-3">${esc(o.receiverName)}<div class="text-[11px] text-muted">${esc(o.receiverPhone)}</div></td>
                <td class="px-4 py-3">${SHIPPING[o.shippingMethod]}</td>
                <td class="px-4 py-3">${PAYMENT[o.paymentMethod]}
                    <div class="text-[11px] ${o.paidAt ? 'text-[#2f6b3a]' : 'text-[#b07a2d]'}">${o.paidAt ? '已付款' : (o.paymentMethod === 'COD' ? '送達時收款' : '未付款')}</div></td>
                <td class="px-4 py-3">${money(o.total)}</td>
                <td class="px-4 py-3">${stageBadge(o)}</td>
                <td class="px-4 py-3 text-right"><button data-open="${o.id}" class="border border-line px-2.5 py-1 text-[12px] text-[#111] hover:border-black">查看</button></td>
            </tr>`).join('');
        $('orderEmpty').classList.toggle('hidden', rows.length > 0);

        visibleIds = rows.map(o => o.id);
        const checked = visibleIds.filter(id => selectedIds.has(id)).length;
        $('selectAll').checked = visibleIds.length > 0 && checked === visibleIds.length;
        $('selectAll').indeterminate = checked > 0 && checked < visibleIds.length;
        $('batchBar').classList.toggle('hidden', selectedIds.size === 0);
        $('batchBar').classList.toggle('flex', selectedIds.size > 0);
        $('batchCount').textContent = selectedIds.size;
    }

    function resetSelection() {
        selectedIds.clear();
        $('batchResult').classList.add('hidden');
    }

    $('stageTabs').addEventListener('click', e => {
        const stage = e.target.closest('[data-stage]')?.dataset.stage;
        if (!stage) return;
        currentStage = stage;
        resetSelection();
        renderOrders();
    });
    ['keyword', 'shipFilter', 'payFilter', 'dateFrom', 'dateTo'].forEach(id => $(id).addEventListener('input', () => { resetSelection(); renderOrders(); }));

    $('orderRows').addEventListener('change', e => {
        const id = Number(e.target.dataset.select);
        if (!id) return;
        e.target.checked ? selectedIds.add(id) : selectedIds.delete(id);
        renderOrders();
    });
    $('orderRows').addEventListener('click', e => {
        const id = e.target.dataset.open;
        if (id) openDrawer(findOrder(id));
    });
    $('selectAll').addEventListener('change', () => {
        visibleIds.forEach(id => $('selectAll').checked ? selectedIds.add(id) : selectedIds.delete(id));
        renderOrders();
    });

    // ===== 改狀態（單筆、整批共用） =====
    // 回傳 true 表示成功；不能做的回傳原因文字
    function ship(o) {
        if (stageOf(o) !== 'TO_SHIP') return stageOf(o) === 'UNPAID' ? '還沒付款' : '不是待出貨';
        o.status = 'SHIPPED';
        o.shippedAt = nowText();
        return true;
    }
    function complete(o) {
        if (o.status !== 'SHIPPED') return '還沒出貨';
        o.status = o.shippingMethod === 'CVS' ? 'PICKED_UP' : 'DELIVERED';
        o.completedAt = nowText();
        if (o.paymentMethod === 'COD') o.paidAt = o.completedAt; // 貨到付款：送達時才收到錢
        return true;
    }

    // ===== 整批操作 =====
    $('batchBar').addEventListener('click', e => {
        const action = e.target.dataset.batch;
        if (!action) return;
        if (action === 'clear') { resetSelection(); renderOrders(); return; }
        const selected = orderList.filter(o => selectedIds.has(o.id));
        if (action === 'pick') return openPickList(selected);

        const fn = action === 'ship' ? ship : complete;
        const failed = [];
        selected.forEach(o => { const result = fn(o); if (result !== true) failed.push({ o, reason: result }); });
        const done = selected.length - failed.length;
        toast(`已將 ${done} 筆標記為${action === 'ship' ? '已出貨' : '已送達／取貨完畢'}` + (failed.length ? `，${failed.length} 筆略過` : ''));
        selectedIds = new Set(failed.map(f => f.o.id));
        if (failed.length) {
            $('batchResult').innerHTML = `<div class="mb-1 font-medium text-[#b0413e]">以下 ${failed.length} 筆沒有變更：</div>`
                + failed.map(f => `<div>${esc(f.o.orderNo)}　<span class="text-[12px] text-muted">${esc(f.reason)}</span></div>`).join('');
            $('batchResult').classList.remove('hidden');
        } else {
            $('batchResult').classList.add('hidden');
        }
        renderOrders();
        renderMenu();
    });

    // ===== 撿貨單：把勾選訂單的商品依貨號加總 =====
    function openPickList(selected) {
        const active = selected.filter(o => o.status !== 'CANCELLED');
        const map = {};
        active.forEach(o => o.items.forEach(it => {
            map[it.skuCode] ??= { ...it, qty: 0, orders: [] };
            map[it.skuCode].qty += it.qty;
            map[it.skuCode].orders.push(o.orderNo);
        }));
        const lines = Object.values(map).sort((a, b) => a.skuCode.localeCompare(b.skuCode));
        $('pickInfo').textContent = `${active.length} 筆訂單、${lines.length} 個貨號、共 ${lines.reduce((s, l) => s + l.qty, 0)} 件　·　${nowText()}　·　${me}`
            + (active.length < selected.length ? `（已排除 ${selected.length - active.length} 筆已取消）` : '');
        $('pickRows').innerHTML = lines.map(l => `
            <tr class="border-b border-line last:border-b-0">
                <td class="py-2 pr-3"><span class="inline-block h-4 w-4 border border-[#111]"></span></td>
                <td class="py-2 pr-3 text-[12px]">${esc(l.skuCode)}</td>
                <td class="py-2 pr-3">${esc(l.productName)}</td>
                <td class="py-2 pr-3">${esc(l.color)} / ${esc(l.size)}</td>
                <td class="py-2 pr-3 text-right text-[15px] font-medium">${l.qty}</td>
                <td class="py-2 text-[11px] text-muted">${l.orders.map(esc).join('<br>')}</td>
            </tr>`).join('');
        $('pickModal').classList.remove('hidden');
        $('pickModal').classList.add('flex');
    }
    $('pickClose').addEventListener('click', () => { $('pickModal').classList.add('hidden'); $('pickModal').classList.remove('flex'); });
    $('pickPrint').addEventListener('click', () => window.print());

    // ===== 訂單明細面板 =====
    let drawerOrder = null;

    function openDrawer(o) {
        drawerOrder = o;
        renderDrawer();
        $('drawer').classList.remove('hidden');
    }
    function closeDrawer() {
        $('drawer').classList.add('hidden');
        drawerOrder = null;
    }

    function renderDrawer() {
        const o = drawerOrder;
        const stage = stageOf(o);
        $('dTitle').textContent = o.orderNo;
        $('dStage').innerHTML = stageBadge(o);

        // 依目前階段顯示能做的事
        const btn = (action, text, primary) => `<button data-action="${action}" class="border px-3 py-1.5 text-[12px] ${primary ? 'border-black bg-black text-white hover:opacity-80' : 'border-line hover:border-black'}">${text}</button>`;
        const actions = [];
        if (stage === 'TO_SHIP') actions.push(btn('ship', '標記已出貨', true));
        if (stage === 'SHIPPED') actions.push(btn('complete', o.shippingMethod === 'CVS' ? '標記取貨完畢' : '標記已送達', true));
        if (stage === 'TO_SHIP' || stage === 'UNPAID') actions.push(btn('cancel', '取消訂單'));
        actions.push(btn('pick', '撿貨單'));
        $('dActions').innerHTML = actions.join('');

        const timeline = [
            ['下單', o.createdAt], ['付款', o.paidAt || (o.paymentMethod === 'COD' ? '貨到付款，送達時收款' : '')],
            ['出貨', o.shippedAt], [o.shippingMethod === 'CVS' ? '取貨' : '送達', o.completedAt],
        ];
        const section = (title, html) => `<div class="mb-6"><h3 class="mb-2 text-[11px] tracking-[.14em] text-muted">${title}</h3>${html}</div>`;
        const row = (k, v) => `<div class="flex gap-3 py-1"><span class="w-[72px] shrink-0 text-muted">${k}</span><span class="min-w-0 break-words">${v}</span></div>`;

        $('dBody').innerHTML =
            (o.status === 'CANCELLED' ? '<div class="mb-5 border border-line bg-paper px-3 py-2 text-[12px] text-muted">這張訂單已取消。（資料庫目前沒有取消時間欄位）</div>' : '')
            + section('進度', `<ol class="flex flex-col gap-1">${timeline.map(([k, v]) => `
                <li class="flex gap-3"><span class="${v ? 'text-[#111]' : 'text-stone'}">${v ? '●' : '○'}</span>
                    <span class="w-[40px] shrink-0 ${v ? '' : 'text-stone'}">${k}</span><span class="text-muted">${esc(v || '—')}</span></li>`).join('')}</ol>`)
            + section('收件資訊',
                row('收件人', esc(o.receiverName)) + row('電話', esc(o.receiverPhone)) + row('Email', esc(o.receiverEmail || '—'))
                + row('配送', SHIPPING[o.shippingMethod]) + row(o.shippingMethod === 'CVS' ? '門市' : '地址', esc(o.shippingAddress))
                + row('備註', o.note ? `<span class="text-[#b07a2d]">${esc(o.note)}</span>` : '—')
                + row('會員', `${esc(o.memberName)} <span class="text-muted">${esc(o.memberEmail)}</span>`))
            + section(`商品（${o.items.reduce((s, it) => s + it.qty, 0)} 件）`, o.items.map(it => `
                <div class="flex gap-3 border-b border-line py-3 last:border-b-0">
                    <img src="${esc(it.imageUrl)}" alt="" class="h-16 w-14 shrink-0 bg-cream object-cover">
                    <div class="min-w-0 flex-1">
                        <div>${esc(it.productName)}</div>
                        <div class="text-[12px] text-muted">${esc(it.color)} / ${esc(it.size)}　·　${esc(it.skuCode)}</div>
                        <div class="text-[12px] text-muted">${money(it.unitPrice)} × ${it.qty}</div>
                    </div>
                    <div class="shrink-0">${money(it.totalPrice)}</div>
                </div>`).join(''))
            + section('金額',
                `<div class="flex justify-between py-1"><span class="text-muted">商品小計</span><span>${money(o.subtotal)}</span></div>`
                + (o.discount ? `<div class="flex justify-between py-1"><span class="text-muted">折價券（${esc(o.couponName)}）</span><span>−${money(o.discount)}</span></div>` : '')
                + `<div class="flex justify-between py-1"><span class="text-muted">運費</span><span>${o.shippingFee ? money(o.shippingFee) : '免運'}</span></div>
                   <div class="mt-1 flex justify-between border-t border-line pt-2 text-[15px] font-medium"><span>實付</span><span>${money(o.total)}</span></div>`)
            + section('付款紀錄（綠界）', o.payments.length ? o.payments.map(p => `
                <div class="mb-2 border border-line px-3 py-2 text-[12px]">
                    <div class="flex justify-between"><span>${esc(p.merchantTradeNo)}</span>${payBadge(p.status)}</div>
                    <div class="mt-1 text-muted">${PAYMENT[p.paymentMethod]}　${money(p.amount)}　建立 ${esc(p.createdAt)}${p.paidAt ? `　付款 ${esc(p.paidAt)}` : ''}</div>
                    ${p.ecpayTradeNo ? `<div class="text-muted">綠界交易編號 ${esc(p.ecpayTradeNo)}</div>` : ''}
                </div>`).join('') : '<p class="text-muted">貨到付款，沒有綠界付款紀錄。</p>');
    }

    function payBadge(status) {
        const style = { PAID: 'text-[#2f6b3a]', PENDING: 'text-[#b07a2d]', FAILED: 'text-[#b0413e]', CANCELLED: 'text-muted' }[status];
        return `<span class="${style}">${PAY_STATUS[status]}</span>`;
    }

    $('dActions').addEventListener('click', e => {
        const action = e.target.dataset.action;
        if (!action) return;
        const o = drawerOrder;
        if (action === 'pick') return openPickList([o]);
        if (action === 'cancel') return openCancel(o);
        const result = action === 'ship' ? ship(o) : complete(o);
        if (result !== true) return toast(`不能變更：${result}`);
        toast(`${o.orderNo} 已${action === 'ship' ? '出貨' : ORDER_STATUS[o.status]}`);
        afterChange();
    });
    $('drawerClose').addEventListener('click', closeDrawer);
    $('drawer').addEventListener('click', e => { if (e.target.id === 'drawer') closeDrawer(); });

    // 狀態變了以後，面板、列表、選單都要更新
    function afterChange() {
        if (drawerOrder) renderDrawer();
        renderOrders();
        renderMenu();
    }

    // ===== 取消訂單 =====
    function openCancel(o) {
        $('cancelTarget').textContent = `${o.orderNo}　${o.receiverName}　${money(o.total)}`;
        const notes = [];
        if (o.paidAt) notes.push(`<div class="border border-[#b0413e] px-3 py-2 text-[#b0413e]">這張訂單已經用${PAYMENT[o.paymentMethod]}付款，取消後要另外到綠界後台辦理退款。</div>`);
        if (o.couponName) notes.push(`<div class="border border-line bg-paper px-3 py-2">有使用折價券「${esc(o.couponName)}」，取消後會退還給會員。</div>`);
        if (!o.paidAt && o.payments.some(p => p.status === 'PENDING')) notes.push('<div class="border border-line bg-paper px-3 py-2">等待中的綠界付款會一起標記為已取消。</div>');
        $('cancelNotes').innerHTML = notes.join('');
        $('restoreStock').checked = true;
        $('cancelModal').classList.remove('hidden');
        $('cancelModal').classList.add('flex');
    }
    function closeCancel() {
        $('cancelModal').classList.add('hidden');
        $('cancelModal').classList.remove('flex');
    }
    $('cancelBack').addEventListener('click', closeCancel);
    $('cancelConfirm').addEventListener('click', () => {
        const o = drawerOrder;
        o.status = 'CANCELLED';
        o.payments.filter(p => p.status === 'PENDING').forEach(p => p.status = 'CANCELLED');
        closeCancel();
        // 訂單頁和商品頁的假資料是分開的，所以庫存加回去只顯示訊息；接後端後由後端處理
        toast(`${o.orderNo} 已取消` + ($('restoreStock').checked ? '，庫存已加回（假的，尚未接後端）' : ''));
        afterChange();
    });

    // ===== 付款紀錄頁 =====
    function renderPayments() {
        const kw = $('payKeyword').value.trim().toLowerCase();
        const status = $('payStatusFilter').value;
        const rows = orderList.flatMap(o => o.payments.map(p => ({ o, p })))
            .filter(({ o, p }) => (!status || p.status === status) &&
                (!kw || o.orderNo.toLowerCase().includes(kw) || p.merchantTradeNo.toLowerCase().includes(kw) || (p.ecpayTradeNo || '').includes(kw)))
            .sort((a, b) => b.p.createdAt.localeCompare(a.p.createdAt));
        $('paymentRows').innerHTML = rows.map(({ o, p }) => `
            <tr class="border-b border-line last:border-b-0">
                <td class="px-4 py-3 text-[12px] text-muted">${esc(p.createdAt)}</td>
                <td class="px-4 py-3"><button data-open="${o.id}" class="underline-offset-2 hover:underline">${esc(o.orderNo)}</button></td>
                <td class="px-4 py-3 text-[12px]">${esc(p.merchantTradeNo)}</td>
                <td class="px-4 py-3 text-[12px] text-muted">${esc(p.ecpayTradeNo || '—')}</td>
                <td class="px-4 py-3">${PAYMENT[p.paymentMethod]}</td>
                <td class="px-4 py-3">${money(p.amount)}</td>
                <td class="px-4 py-3">${payBadge(p.status)}</td>
                <td class="px-4 py-3 text-[12px] text-muted">${esc(p.paidAt || '—')}</td>
            </tr>`).join('');
        $('paymentEmpty').classList.toggle('hidden', rows.length > 0);
    }
    $('payKeyword').addEventListener('input', renderPayments);
    $('payStatusFilter').addEventListener('input', renderPayments);
    $('paymentRows').addEventListener('click', e => {
        const id = e.target.dataset.open;
        if (id) openDrawer(findOrder(id));
    });

    // ===== 共用 =====
    let toastTimer;
    function toast(text) {
        $('toast').textContent = text;
        $('toast').classList.remove('opacity-0');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => $('toast').classList.add('opacity-0'), 2500);
    }

    showPage('orders');
</script>
</body>
</html>

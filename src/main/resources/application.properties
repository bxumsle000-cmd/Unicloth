spring.application.name=Unicloth
spring.datasource.url=jdbc:sqlserver://localhost:14321;databaseName=Unicloth;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=Eeit25@Unicloth
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ============================== Flyway 資料庫版本控管 ====================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false


# ============================== JPA / Hibernate ==============================
# 資料表結構一律由 Flyway 負責，絕對不要讓 Hibernate 自己去改結構。
# validate 只會在啟動時「比對」Entity 和資料表（欄位名稱、型別），對不上就啟動失敗，

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================== HikariCP 連線池設定 ==============================
spring.datasource.hikari.pool-name=MyHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ============================== 其他設定 ==============================

# 當 Controller 回傳 Page 時，序列化前自動幫我包成 PagedModel
spring.data.web.pageable.serialization-mode=via_dto

# ============================== JWT ==============================
# 簽章金鑰：HS256 至少要 32 bytes。正式環境請用環境變數 JWT_SECRET 覆蓋，不要用這裡的預設值。
# token 有效時間：86400000 毫秒 = 1 天
jwt.secret=${JWT_SECRET:7f3c9a1e5b2d84f06c1a9e3b7d5f2048a6c3e9b1d7f5024c8a6e3b9d1f7c5a20}
jwt.expiration-ms=86400000

# ============================== Firebase 登入 ==============================
# Firebase 專案 ID（Firebase Console → 專案設定 → 一般 → 專案 ID），用來驗證前端送來的 ID token。
# 不是機密，全組共用 kinu-62cd9；想換成自己的專案測試，用環境變數 FIREBASE_PROJECT_ID 覆蓋。
# 要跟前端 frontend/.env 的 VITE_FIREBASE_PROJECT_ID 一樣，不然後端驗 token 會失敗（401）。
firebase.project-id=kinu-62cd9

# ============================== 種子資料 ==============================
# true：啟動時把 data/products.json 匯進資料庫（已存在的 slug 會跳過，重跑不會重複）
# false：什麼都不做。匯完可以改回 false，或留著也沒關係。
app.seed.products=true
# true：啟動時塞展示用的假資料（30 位會員、往前 15 個月的訂單、折價券、客服單、入庫紀錄…），已經塞過就跳過（見 DemoDataSeeder）
app.seed.demo-data=true
# ============================== 綠界測試金流 ==============================
ecpay.merchant-id=${ECPAY_MERCHANT_ID:3002607}
ecpay.hash-key=${ECPAY_HASH_KEY:pwFHCqoQZGmho4w6}
ecpay.hash-iv=${ECPAY_HASH_IV:EkRm7iFT261dpevs}

# 綠界測試付款 API
ecpay.api-url=https://payment-stage.ecpay.com.tw/Cashier/AioCheckOut/V5

# 綠界付款結果通知網址
# 留空 = 自動抓 docker-compose 裡 tunnel 目前的網址（建議，網址變了也不用改）
# 有設定 ECPAY_RETURN_URL 就固定用那個網址
ecpay.return-url=${ECPAY_RETURN_URL:}
# 問 tunnel 目前網址的地方（docker-compose 的 tunnel 服務開在本機 20241）
ecpay.tunnel-api-url=${ECPAY_TUNNEL_API_URL:http://127.0.0.1:20241/quicktunnel}
# 綠界付款後返回 KINU 訂單頁
ecpay.client-back-url=${ECPAY_CLIENT_BACK_URL:http://localhost:5173/orders}

# ============================== 逾時未付款自動取消（OrderTimeoutScheduler） ==============================
# 建立訂單後超過幾分鐘還沒付款，就自動取消並還原庫存、折價券
order.payment-timeout.credit-minutes=30
# ATM 要比綠界繳費期限長，不然顧客還沒轉帳就被取消（5760 分鐘 = 4 天）
order.payment-timeout.atm-minutes=5760
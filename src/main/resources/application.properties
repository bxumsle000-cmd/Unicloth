spring.application.name=Unicloth
spring.datasource.url=jdbc:sqlserver://localhost:14321;databaseName=Unicloth;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=Eeit25@Unicloth
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ============================== Flyway 資料庫版本控管 ====================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false


# ============================== JPA / Hibernate ==============================
# 資料表結構一律由 Flyway 負責，絕對不要讓 Hibernate 自己去改結構。
# validate 只會在啟動時「比對」Entity 和資料表（欄位名稱、型別），對不上就啟動失敗，

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================== HikariCP 連線池設定 ==============================
spring.datasource.hikari.pool-name=MyHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ============================== 其他設定 ==============================

# 當 Controller 回傳 Page 時，序列化前自動幫我包成 PagedModel
spring.data.web.pageable.serialization-mode=via_dto

# ============================== 種子資料 ==============================
# true：啟動時把 data/products.json 匯進資料庫（已存在的 slug 會跳過，重跑不會重複）
# false：什麼都不做。匯完可以改回 false，或留著也沒關係。
app.seed.products=false
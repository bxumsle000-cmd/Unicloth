# 小提醒：值寫成 "${變數名:預設值}" 的意思是「有設這個環境變數就用它，沒設就用冒號後面的預設值」

# Spring Boot 本身的設定都放在 spring 底下
spring:
  application:
    name: Unicloth

  # 資料庫連線設定
  datasource:
    # JDBC 連線網址：連本機 14321 port 的 SQL Server、使用 Unicloth 資料庫；encrypt=true 加密連線，trustServerCertificate=true 信任開發用的自簽憑證
    url: "jdbc:sqlserver://localhost:14321;databaseName=Unicloth;encrypt=true;trustServerCertificate=true"
    username: sa
    password: "Eeit25@Unicloth"
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

    # ============================== HikariCP 連線池設定 ==============================
    # HikariCP 是 Spring Boot 預設的連線池：事先開好幾條資料庫連線重複使用，不用每次查詢都重新連線
    hikari:
      pool-name: MyHikariPool
      # 連線池最多同時開幾條連線
      maximum-pool-size: 10
      # 連線池最少保留幾條閒置連線待命
      minimum-idle: 5
      # 跟連線池借連線時最多等幾毫秒，超過就丟例外（30000 毫秒 = 30 秒）
      connection-timeout: 30000
      # 閒置連線超過幾毫秒會被關掉，只在連線數多於 minimum-idle 時才會關（600000 毫秒 = 10 分鐘）
      idle-timeout: 600000
      # 一條連線最長能用多久，到期就換一條新的（1800000 毫秒 = 30 分鐘）
      max-lifetime: 1800000

  # ============================== Flyway 資料庫版本控管 ====================================
  # Flyway 會依照版本號依序執行 SQL 腳本，建立或修改資料表結構
  flyway:
    enabled: true
    locations: classpath:db/migration
    # false：資料庫已經有資料表、卻沒有 Flyway 的版本紀錄表時，不自動設基準點，直接報錯讓你發現
    baseline-on-migrate: false

  # ============================== JPA / Hibernate ==============================
  # 資料表結構一律由 Flyway 負責，絕對不要讓 Hibernate 自己去改結構。
  # validate 只會在啟動時「比對」Entity 和資料表（欄位名稱、型別），對不上就啟動失敗，
  jpa:
    hibernate:
      # validate：只比對 Entity 和資料表，不建表、不改表
      ddl-auto: validate
    # false：不在整個 HTTP 請求期間一直開著資料庫 Session，Lazy 載入的關聯要在 Service 裡（交易內）就先取好
    open-in-view: false
    # 在 console 印出 Hibernate 執行的 SQL，方便除錯
    show-sql: true
    # 直接傳給 Hibernate 的額外設定
    properties:
      hibernate:
        # 印出的 SQL 自動換行、縮排，比較好讀
        format_sql: true

  # ============================== 其他設定 ==============================
  # Spring Data 的設定
  data:
    # Spring Data 跟 Web（Controller）整合的設定
    web:
      # 分頁（Pageable / Page）相關設定
      pageable:
        # 當 Controller 回傳 Page 時，序列化前自動幫我包成 PagedModel（JSON 會是 content + page 的格式）
        serialization-mode: via_dto

# ============================== JWT ==============================
# 以下是專案自訂的設定，由 JwtProperties 讀取
jwt:
  # 簽章金鑰：HS256 至少要 32 bytes。正式環境請用環境變數 JWT_SECRET 覆蓋，不要用這裡的預設值。
  secret: "${JWT_SECRET:7f3c9a1e5b2d84f06c1a9e3b7d5f2048a6c3e9b1d7f5024c8a6e3b9d1f7c5a20}"
  # token 有效時間：86400000 毫秒 = 1 天
  expiration-ms: 86400000

# ============================== Firebase 登入 ==============================
# 以下是專案自訂的設定，由 FirebaseTokenVerifier 用 @Value 讀取
firebase:
  # Firebase 專案 ID（Firebase Console → 專案設定 → 一般 → 專案 ID），用來驗證前端送來的 ID token。
  # 不是機密，全組共用 kinu-62cd9；想換成自己的專案測試，用環境變數 FIREBASE_PROJECT_ID 覆蓋。
  # 要跟前端 frontend/.env 的 VITE_FIREBASE_PROJECT_ID 一樣，不然後端驗 token 會失敗（401）。
  project-id: kinu-62cd9

# ============================== 種子資料 ==============================
# 專案自訂的應用程式設定
app:
  # 種子資料（啟動時自動塞進資料庫的資料）開關
  seed:
    # true：啟動時把 data/products.json 匯進資料庫（已存在的 slug 會跳過，重跑不會重複）
    # false：什麼都不做。匯完可以改回 false，或留著也沒關係。（見 DataSeeder）
    products: true
    # true：啟動時塞展示用的假資料（30 位會員、往前 15 個月的訂單、折價券、客服單、入庫紀錄…），已經塞過就跳過（見 DemoDataSeeder）
    demo-data: true

# ============================== 綠界測試金流 ==============================
# 綠界 ECPay 金流設定，由 EcpayService、EcpayCallbackService、EcpayReturnUrlResolver 讀取
ecpay:
  # 特店編號（MerchantID），3002607 是綠界公開的測試特店
  merchant-id: "${ECPAY_MERCHANT_ID:3002607}"
  # HashKey：計算檢查碼（CheckMacValue）時用的金鑰
  hash-key: "${ECPAY_HASH_KEY:pwFHCqoQZGmho4w6}"
  # HashIV：計算檢查碼（CheckMacValue）時用的另一把金鑰
  hash-iv: "${ECPAY_HASH_IV:EkRm7iFT261dpevs}"

  # 綠界測試付款 API（payment-stage 是測試環境，不會真的扣款）
  api-url: "https://payment-stage.ecpay.com.tw/Cashier/AioCheckOut/V5"

  # 綠界付款結果通知網址（ReturnURL），付款完成後綠界會打這個網址通知後端
  # 留空 = 自動抓 docker-compose 裡 tunnel 目前的網址（建議，網址變了也不用改）
  # 有設定 ECPAY_RETURN_URL 就固定用那個網址
  return-url: "${ECPAY_RETURN_URL:}"
  # 問 tunnel 目前網址的地方（docker-compose 的 tunnel 服務開在本機 20241）
  tunnel-api-url: "${ECPAY_TUNNEL_API_URL:http://127.0.0.1:20241/quicktunnel}"
  # 綠界付款後返回 KINU 訂單頁（ClientBackURL，顧客在綠界頁面按「返回商店」會回到這裡）
  client-back-url: "${ECPAY_CLIENT_BACK_URL:http://localhost:8080/orders}"

# ============================== 逾時未付款自動取消（OrderTimeoutScheduler） ==============================
# 訂單相關的自訂設定
order:
  # 付款期限：建立訂單後超過幾分鐘還沒付款，就自動取消並還原庫存、折價券
  payment-timeout:
    # 信用卡付款的期限：30 分鐘
    credit-minutes: 30
    # ATM 要比綠界繳費期限長，不然顧客還沒轉帳就被取消（5760 分鐘 = 4 天）
    atm-minutes: 5760

# ============================== 銷售數據（Python 分析服務） ==============================
# 行銷後台的銷售數據由 analytics/main.py 計算，Spring Boot 擋完權限再轉給它（見 AdminSalesService）
analytics:
  # 分析服務的網址，預設是本機 8000 port；可用環境變數 ANALYTICS_BASE_URL 覆蓋
  base-url: "${ANALYTICS_BASE_URL:http://127.0.0.1:8000}"

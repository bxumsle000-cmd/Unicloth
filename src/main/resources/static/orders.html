<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#F6F5F2">
    <title>我的訂單 — KINU</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/kinu.css">
    <style>
        /* ===== 訂單頁專用 ===== */
        .order-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 30px; }
        .order-tabs .chip.active { background: #000; color: #fff; border-color: #000; }
        .order-list { display: flex; flex-direction: column; gap: 16px; margin-top: 24px; }
        .order { background: #fff; }
        .order-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; padding: 18px 22px; border-bottom: 1px solid var(--line); }
        .order-head .no { font-size: 13px; letter-spacing: .08em; }
        .order-head .date { font-size: 10px; color: var(--muted); letter-spacing: .06em; margin-top: 4px; }
        .order-head .status { font-size: 10px; letter-spacing: .1em; padding: 5px 10px; border: 1px solid #000; }
        .order-head .status.cancelled { border-color: var(--line); color: var(--muted); }
        .order-items { padding: 0 22px; }
        .order-item { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
        .order-item:last-child { border-bottom: 0; }
        .order-item .thumb { aspect-ratio: 3/4; background: var(--cream); overflow: hidden; }
        .order-item .thumb img { width: 100%; height: 100%; object-fit: cover; }
        .order-item .name { font-size: 12px; letter-spacing: .04em; line-height: 1.6; }
        .order-item .meta { font-size: 10px; color: var(--muted); letter-spacing: .06em; margin-top: 4px; }
        .order-item .price { font-size: 12px; }
        .order-foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; padding: 16px 22px; background: var(--cream); }
        .order-foot .info { font-size: 10px; color: var(--muted); letter-spacing: .06em; line-height: 1.9; }
        .order-foot .total { font-size: 14px; letter-spacing: .04em; }
        .order-foot .total span { font-size: 10px; color: var(--muted); margin-right: 8px; }
        @media (max-width: 760px) {
            .order-head, .order-items, .order-foot { padding-left: 16px; padding-right: 16px; }
            .order-item { grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; }
        }
    </style>
</head>
<body>
<div id="site-header"></div>

<main class="page">
    <div class="page-eyebrow">ORDERS</div>
    <h1 class="page-title">我的訂單</h1>
    <div class="page-sub" id="count"></div>
    <div class="order-tabs" id="tabs"></div>
    <div id="content"><div class="state">載入中…</div></div>
</main>

<div id="site-footer"></div>

<script src="/js/kinu.js"></script>
<script src="/js/orders.js"></script>
</body>
</html>

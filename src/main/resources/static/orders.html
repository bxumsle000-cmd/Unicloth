<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#F6F5F2">
    <title>我的訂單 — KINU</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/kinu.css">
    <style>
        /* ===== 訂單頁專用 ===== */
        .order-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 30px; }
        .order-tabs .chip.active { background: #000; color: #fff; border-color: #000; }
        .order-list { display: flex; flex-direction: column; gap: 16px; margin-top: 24px; }
        .order { background: #fff; }
        .order-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; padding: 18px 22px; border-bottom: 1px solid var(--line); }
        .order-head .no { font-size: 13px; letter-spacing: .08em; }
        .order-head .date { font-size: 10px; color: var(--muted); letter-spacing: .06em; margin-top: 4px; }
        .order-head .status { font-size: 10px; letter-spacing: .1em; padding: 5px 10px; border: 1px solid #000; }
        .order-head .status.cancelled { border-color: var(--line); color: var(--muted); }
        .order-items { padding: 0 22px; }
        .order-item { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
        .order-item:last-child { border-bottom: 0; }
        .order-item .thumb { aspect-ratio: 3/4; background: var(--cream); overflow: hidden; }
        .order-item .thumb img { width: 100%; height: 100%; object-fit: cover; }
        .order-item .name { font-size: 12px; letter-spacing: .04em; line-height: 1.6; }
        .order-item .meta { font-size: 10px; color: var(--muted); letter-spacing: .06em; margin-top: 4px; }
        .order-item .price { font-size: 12px; }
        .order-foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; padding: 16px 22px; background: var(--cream); }
        .order-foot .info { font-size: 10px; color: var(--muted); letter-spacing: .06em; line-height: 1.9; }
        .order-foot .total { font-size: 14px; letter-spacing: .04em; }
        .order-foot .total span { font-size: 10px; color: var(--muted); margin-right: 8px; }
        @media (max-width: 760px) {
            .order-head, .order-items, .order-foot { padding-left: 16px; padding-right: 16px; }
            .order-item { grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; }
        }
    </style>
</head>
<body>
<div id="site-header"></div>

<main class="page">
    <div class="page-eyebrow">ORDERS</div>
    <h1 class="page-title">我的訂單</h1>
    <div class="page-sub" id="count"></div>
    <div class="order-tabs" id="tabs"></div>
    <div id="content"><div class="state">載入中…</div></div>
</main>

<div id="site-footer"></div>

<script src="/js/kinu.js"></script>
<script>
    // status 是後端 OrderStatus 的 name()，中文對照同 OrderStatus 的 label
    const STATUS_TEXT = {
        PENDING: '訂單確認中',
        SHIPPED: '已出貨',
        DELIVERED: '已送達',
        PICKED_UP: '取貨完畢',
        CANCELLED: '已取消'
    };
    // 代碼對照同 CheckoutRequest 的驗證規則
    const SHIPPING_TEXT = { home: '宅配', cvs: '超商取貨' };
    const PAYMENT_TEXT = { credit: '信用卡', atm: 'ATM 轉帳', cod: '貨到付款' };
    const TABS = [{ key: 'all', label: '全部' }, ...Object.keys(STATUS_TEXT).map(key => ({ key, label: STATUS_TEXT[key] }))];
    let orders = [];
    let tab = 'all';

    function render() {
        document.getElementById('count').textContent = orders.length ? `共 ${orders.length} 筆訂單` : '';

        document.getElementById('tabs').innerHTML = orders.length === 0 ? '' : TABS.map(t => {
            const n = t.key === 'all' ? orders.length : orders.filter(o => o.status === t.key).length;
            return `<button class="chip${t.key === tab ? ' active' : ''}" data-tab="${t.key}">${t.label} ${n}</button>`;
        }).join('');
        document.querySelectorAll('[data-tab]').forEach(btn => btn.addEventListener('click', () => {
            tab = btn.dataset.tab;
            render();
        }));

        const box = document.getElementById('content');
        if (orders.length === 0) {
            box.innerHTML = '<div class="state">目前還沒有訂單。<br><a href="/products.html?category=all_women">去逛逛</a></div>';
            return;
        }
        const list = tab === 'all' ? orders : orders.filter(o => o.status === tab);
        box.innerHTML = list.length === 0
            ? `<div class="state">目前沒有${STATUS_TEXT[tab]}的訂單</div>`
            : `<div class="order-list">${list.map(orderCard).join('')}</div>`;
    }

    function orderCard(o) {
        return `
            <div class="order">
                <div class="order-head">
                    <div>
                        <div class="no">${esc(o.orderNo)}</div>
                        <div class="date">${fmtDate(o.createdAt)} 下單</div>
                    </div>
                    <span class="status${o.status === 'CANCELLED' ? ' cancelled' : ''}">${STATUS_TEXT[o.status] || esc(o.status)}</span>
                </div>
                <div class="order-items">${o.orderItemResponseList.map(itemRow).join('')}</div>
                <div class="order-foot">
                    <div class="info">
                        ${esc(o.receiverName)}　${esc(o.receiverPhone)}<br>
                        ${SHIPPING_TEXT[o.shippingMethod] || esc(o.shippingMethod)}　·　${esc(o.shippingAddress)}<br>
                        ${PAYMENT_TEXT[o.paymentMethod] || esc(o.paymentMethod)}${o.note ? `　·　備註：${esc(o.note)}` : ''}
                    </div>
                    <div class="total"><span>實付金額</span>${money(o.total)}</div>
                </div>
            </div>`;
    }

    function itemRow(it) {
        const img = it.imageUrl ? `<img src="${esc(imgSrc(it.imageUrl))}" alt="${esc(it.productName)}" loading="lazy">` : '';
        return `
            <div class="order-item">
                <div class="thumb">${img}</div>
                <div>
                    <div class="name">${esc(it.productName)}</div>
                    <div class="meta">${esc(it.color)}　/　${esc(it.size)}　·　數量 ${it.qty}</div>
                </div>
                <div class="price">${money(it.totalPrice)}</div>
            </div>`;
    }

    (async () => {
        try {
            orders = await api('/api/orders');
            render();
        } catch (e) {
            document.getElementById('content').innerHTML = `<div class="state">${esc(e.message)}</div>`;
        }
    })();
</script>
</body>
</html>

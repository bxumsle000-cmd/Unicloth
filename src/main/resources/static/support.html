<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#F6F5F2">
    <title>聯絡我們 — KINU</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/kinu.css">
    <style>
        /* ===== 客服頁專用 ===== */
        .support-layout { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 48px; align-items: start; margin-top: 30px; }
        .support-layout h2 { font-size: 11px; letter-spacing: .22em; font-weight: 500; margin: 0 0 18px; }

        /* 表單：沿用結帳表單的底線輸入框 */
        .support-form { background: #fff; padding: 24px 22px; display: flex; flex-direction: column; gap: 16px; }
        .support-form h2 { margin: 0; }
        .support-form label { display: flex; flex-direction: column; gap: 6px; font-size: 10px; color: var(--muted); letter-spacing: .08em; }
        .support-form input, .support-form select, .support-form textarea { width: 100%; box-sizing: border-box; padding: 8px 0; border: 0; border-bottom: 1px solid var(--line); background: transparent; font-size: 12px; color: #000; letter-spacing: .04em; outline: none; border-radius: 0; }
        .support-form textarea { resize: vertical; line-height: 1.7; }
        .support-form input:focus, .support-form select:focus, .support-form textarea:focus { border-color: #000; }
        .support-form .hint { font-size: 10px; color: var(--muted); letter-spacing: .06em; text-align: right; }
        .support-form .btn { margin-top: 4px; }

        /* 我的客服單 */
        .ticket-list { display: flex; flex-direction: column; gap: 16px; }
        .ticket { background: #fff; }
        .ticket-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; padding: 16px 22px; border-bottom: 1px solid var(--line); }
        .ticket-head .no { font-size: 13px; letter-spacing: .08em; }
        .ticket-head .date { font-size: 10px; color: var(--muted); letter-spacing: .06em; margin-top: 4px; }
        .ticket-head .status { font-size: 10px; letter-spacing: .1em; padding: 5px 10px; border: 1px solid #000; }
        .ticket-head .status.resolved { border-color: var(--line); color: var(--muted); }
        .ticket-body { padding: 16px 22px 18px; }
        .ticket-body .topic { font-size: 10px; letter-spacing: .1em; color: var(--muted); }
        .ticket-body .message { font-size: 12px; letter-spacing: .04em; line-height: 1.8; margin-top: 8px; white-space: pre-wrap; word-break: break-word; }
        #tickets .state { padding: 50px 0; }

        @media (max-width: 900px) {
            .support-layout { grid-template-columns: 1fr; gap: 36px; }
        }
        @media (max-width: 760px) {
            .support-form, .ticket-head, .ticket-body { padding-left: 16px; padding-right: 16px; }
        }
    </style>
</head>
<body>
<div id="site-header"></div>

<main class="page">
    <div class="page-eyebrow">CONTACT</div>
    <h1 class="page-title">聯絡我們</h1>
    <div class="page-sub">有任何問題都可以留言給我們，客服會以 Email 回覆。</div>

    <div class="support-layout">
        <form class="support-form" id="supportForm" novalidate>
            <h2>送出客服單</h2>
            <label>Email（客服回覆用）<input type="email" name="email" maxlength="255" required autocomplete="email"></label>
            <label>問題類型
                <select name="topic" required>
                    <option value="" disabled selected>請選擇</option>
                </select>
            </label>
            <label>問題內容<textarea name="message" rows="6" maxlength="2000" required placeholder="請描述你遇到的狀況，若和訂單有關，請附上訂單編號"></textarea></label>
            <div class="hint" id="messageCount">0 / 2000</div>
            <button class="btn" type="submit">送出</button>
        </form>

        <section>
            <h2>我的客服單</h2>
            <div id="tickets"><div class="state">載入中…</div></div>
        </section>
    </div>
</main>

<div id="site-footer"></div>

<script src="/js/kinu.js"></script>
<script src="/js/support.js"></script>
</body>
</html>

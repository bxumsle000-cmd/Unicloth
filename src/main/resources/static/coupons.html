<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#F6F5F2">
    <title>我的折價券 — KINU</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/kinu.css">
    <style>
        /* ===== 折價券頁專用 ===== */
        .coupon-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 30px; }
        .coupon-tabs .chip.active { background: #000; color: #fff; border-color: #000; }
        .coupon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; margin-top: 24px; }
        .coupon { display: grid; grid-template-columns: 110px minmax(0, 1fr); background: #fff; min-height: 128px; }
        .coupon .benefit { background: #000; color: #fff; display: flex; align-items: center; justify-content: center; text-align: center; padding: 12px; font-size: 18px; letter-spacing: .04em; line-height: 1.3; }
        .coupon .info { padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; border-left: 1px dashed var(--line); }
        .coupon .title { font-size: 13px; letter-spacing: .04em; line-height: 1.6; }
        .coupon .rule, .coupon .date { font-size: 10px; color: var(--muted); letter-spacing: .06em; }
        .coupon .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .coupon .code { font-size: 10px; letter-spacing: .12em; color: var(--muted); }
        .coupon .status { font-size: 10px; letter-spacing: .1em; }
        .coupon.inactive .benefit { background: var(--stone); }
        .coupon.inactive .title { color: var(--muted); }
        @media (max-width: 760px) {
            .coupon-grid { grid-template-columns: 1fr; }
            .coupon { grid-template-columns: 92px minmax(0, 1fr); }
        }
    </style>
</head>
<body>
<div id="site-header"></div>

<main class="page">
    <div class="page-eyebrow">COUPONS</div>
    <h1 class="page-title">我的折價券</h1>
    <div class="page-sub" id="count"></div>
    <div class="coupon-tabs" id="tabs"></div>
    <div id="content"><div class="state">載入中…</div></div>
</main>

<div id="site-footer"></div>

<script src="/js/kinu.js"></script>
<script src="/js/coupons.js"></script>
</body>
</html>

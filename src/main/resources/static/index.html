<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#F6F5F2">
    <title>KINU — Everyday, beautifully.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- 頁首、頁尾、語言選單等共用樣式 -->
    <link rel="stylesheet" href="/css/kinu.css">
    <style>
        /* ===== 首頁專用：主視覺、跑馬標語、系列大圖、秋冬預告 ===== */

        /* 主視覺 */
        .hero { margin: 20px 3.7% 0; position: relative; min-height: 535px; height: min(59vw,650px); overflow: hidden; background: #d9d2c9; }
        .hero-video { width: 100%; height: 100%; object-fit: cover; object-position: center 42%; position: absolute; inset: 0; filter: saturate(.73); }
        .hero:after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg,rgba(25,22,19,.35),transparent 72%); pointer-events: none; }
        .hero-copy { position: absolute; z-index: 1; left: 8%; top: 50%; transform: translateY(-43%); color: #fff; max-width: 440px; }
        .eyebrow { font-size: 10px; letter-spacing: .23em; text-transform: uppercase; }
        .hero h1 { font: 400 clamp(38px,5.3vw,72px)/1.18 var(--serif); letter-spacing: .03em; margin: 18px 0 15px; }
        .hero p { font-size: 12px; letter-spacing: .07em; line-height: 2; margin: 0 0 27px; }
        .pill { height: 45px; padding: 0 23px; background: #fff; color: #000; font-size: 10px; letter-spacing: .13em; display: inline-flex; align-items: center; gap: 18px; transition: .2s; text-decoration: none; }
        .pill:hover { background: var(--cream); }
        .pill span { font-size: 17px; }
        .hero-dots { position: absolute; right: 5%; bottom: 26px; z-index: 2; color: #fff; font-size: 10px; letter-spacing: .15em; display: flex; align-items: center; gap: 8px; }
        .hero-dots button { color: white; font-size: 22px; }

        /* 跑馬標語 */
        .ticker { display: flex; align-items: center; justify-content: center; gap: 34px; padding: 23px 12px; color: #6f6963; font-size: 9px; letter-spacing: .18em; }
        .ticker i { width: 3px; height: 3px; background: #a9a198; border-radius: 50%; }

        @media (max-width: 760px) {
            .hero { margin: 12px 3% 0; height: 590px; min-height: 0; }
            .hero-video { object-position: 58% center; }
            .hero:after { background: linear-gradient(0deg,rgba(0,0,0,.5),transparent 82%); }
            .hero-copy { left: 7%; top: auto; bottom: 13%; transform: none; max-width: 300px; }
            .hero h1 { font-size: 47px; }
            .ticker { gap: 12px; font-size: 7px; letter-spacing: .08em; flex-wrap: wrap; }
        }

        /* 系列大圖 */
        .look-feature { height: min(50vw,560px); min-height: 360px; position: relative; display: block; overflow: hidden; background: var(--stone); color: white; text-decoration: none; }
        .look-feature img { width: 100%; height: 100%; object-fit: cover; filter: brightness(.78) saturate(.8); transition: transform .65s; }
        .look-feature:hover img { transform: scale(1.025); }
        @media (max-width: 760px) {
            .look-feature { height: 390px; min-height: 0; }
        }

        /* ===== 滿版主視覺、系列大圖、秋冬預告 ===== */
        .hero { margin: 0 !important; width: 100vw; max-width: 100%; height: min(68vw,760px); min-height: 540px; }
        .look-feature { height: min(55vw,660px); min-height: 440px; width: 100%; margin: 0; }
        .look-feature img { object-position: center 42%; }
        .drop-section { margin: 0 0 72px; }
        .campaign-final { position: relative; height: min(63vw,760px); min-height: 510px; overflow: hidden; color: #fff; }
        .campaign-final img { width: 100%; height: 100%; object-fit: cover; filter: brightness(.65) saturate(.72); }
        .campaign-copy { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .campaign-copy > span { font-size: 10px; letter-spacing: .25em; }
        .campaign-copy h2 { font-size: clamp(36px,5vw,66px); font-weight: 500; line-height: 1.25; letter-spacing: .08em; margin: 20px 0; }
        .campaign-copy p { font-size: 16px; letter-spacing: .2em; margin: 0 0 10px; }
        .campaign-copy strong { font-size: 12px; letter-spacing: .2em; font-weight: 400; }
        @media (max-width: 760px) {
            .hero { height: 78vh; min-height: 530px; }
            .look-feature { height: 430px; min-height: 0; }
            .drop-section { margin-bottom: 48px; }
            .campaign-final { height: 68vh; min-height: 500px; }
        }
        .drop-section:first-child .look-feature { isolation: isolate; aspect-ratio: 2/1; height: auto; min-height: 0; }
        .drop-section:first-child .look-feature::after { content: ""; position: absolute; z-index: 1; inset: 0; background: transparent; }
        .drop-section:first-child .look-feature img { position: relative; z-index: 0; }
        @media (max-width: 760px) {
            .drop-section:first-child .look-feature { aspect-ratio: 2/1; height: auto; min-height: 0; }
        }
        .look-feature { aspect-ratio: 2/1; height: auto; min-height: 0; }
        .look-feature img { filter: none; transition: none; }
        .look-feature:hover img { transform: none; }
    </style>
</head>
<body>
<!-- 公告列、頁首（含分類選單）由 js/kinu.js 產生 -->
<div id="site-header"></div>

<main>
    <!-- 主視覺影片輪播 -->
    <section class="hero">
        <video class="hero-video" id="heroVideo" autoplay muted playsinline poster="img/campaign.jpg">
            <source src="video/hero-01.mp4" type="video/mp4">
        </video>
        <div class="hero-copy">
            <div class="eyebrow" data-i18n="heroeyebrow">THE ART OF EVERYDAY</div>
            <h1 data-i18n="heroTitle">日常，<br>恰好的美。</h1>
            <p data-i18n="heroText">留一點餘白，給生活更多可能。<br>以柔軟質地，陪你走過每一個日常。</p>
            <a class="pill" href="#collections"><span data-i18n="shopnow">探索本季新品</span><span>→</span></a>
        </div>
        <div class="hero-dots">
            <button onclick="changeSlide(-1)">‹</button>
            <span id="slideCount">01　/　03</span>
            <button onclick="changeSlide(1)">›</button>　<span id="slideDots">●　○　○</span>
        </div>
    </section>

    <div class="ticker"><span>MADE FOR YOUR EVERYDAY</span><i></i><span>天然質地・自在生活</span><i></i><span>LESS, BUT BETTER</span></div>

    <!-- 三個系列大圖：點下去進對應的分類商品列表 -->
    <section class="collection-drops" id="collections">
        <section class="drop-section">
            <a class="look-feature" href="/products.html?category=all_women"><img src="img/look-01.png" alt="KINU 秋日女裝穿搭"></a>
        </section>
        <section class="drop-section">
            <a class="look-feature" href="/products.html?category=all_men"><img src="img/look-02.png" alt="KINU 秋日男裝穿搭"></a>
        </section>
        <section class="drop-section">
            <a class="look-feature" href="/products.html?category=all_kids"><img src="img/look-03.png" alt="KINU 秋冬衣著系列"></a>
        </section>
    </section>

    <!-- 秋冬預告 -->
    <section class="campaign-final">
        <img src="img/campaign.jpg" alt="KINU 2026 秋冬系列形象照">
        <div class="campaign-copy">
            <span>COMING SOON</span>
            <h2>KINU 2026<br>秋冬系列</h2>
            <p>即將販售</p>
            <strong>2026.10.15</strong>
        </div>
    </section>
</main>

<!-- 頁尾由 js/kinu.js 產生 -->
<div id="site-footer"></div>

<script src="/js/kinu.js"></script>
<script src="/js/index.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>商品頁（測試用）</title>
    <style>
        body { font-family: sans-serif; margin: 0; color: #222; }
        a { color: inherit; }

        main { padding: 16px 24px; }
        .back { display: inline-block; margin-bottom: 12px; }

        .detail { display: flex; flex-wrap: wrap; gap: 32px; }
        .detail img { width: 400px; max-width: 100%; aspect-ratio: 1; object-fit: cover; background: #f2f2f2; }
        .info { flex: 1; min-width: 260px; }

        .price { font-size: 22px; font-weight: bold; }
        .price.sale { color: #d00; }
        .orig { color: #888; text-decoration: line-through; margin-left: 8px; }
        .desc { color: #555; white-space: pre-line; }

        h4 { margin: 20px 0 8px; }
        .options { display: flex; flex-wrap: wrap; gap: 8px; }
        .options button { padding: 6px 14px; border: 1px solid #999; border-radius: 4px;
                          background: #fff; cursor: pointer; }
        .options button.active { background: #222; color: #fff; border-color: #222; }
        .options button:disabled { color: #bbb; border-color: #ddd; text-decoration: line-through; cursor: not-allowed; }

        .selected { margin-top: 16px; color: #555; }
        .cart-row { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
        .cart-row input { width: 64px; padding: 4px; }
        .cart { padding: 10px 24px; }
        #cartMsg { margin-top: 8px; }
        .wish { margin-left: 8px; padding: 4px 12px; border: 1px solid #999; border-radius: 16px;
                background: #fff; cursor: pointer; font-size: 14px; vertical-align: middle; }
        .wish.on { color: #d00; border-color: #d00; }
        .error { color: #d00; }
    </style>
</head>
<body>

<main>
    <a class="back" href="javascript:history.back()">‹ 回上一頁</a>
    <a class="back" href="cart.html" style="float:right">購物車 ›</a>
    <a class="back" href="wishlist.html" style="float:right; margin-right:16px">追蹤清單 ›</a>
    <div id="page"></div>
</main>

<script>
    // 網址長這樣：product.html?slug=men-487511
    const slug = new URLSearchParams(location.search).get('slug');

    let product = null;        // API 回傳的 ProductDetailResponse
    let colorIndex = 0;        // 目前選的顏色（colors 陣列的位置）
    let selectedSize = null;   // 目前選的 SizeOption
    let inWishlist = false;    // 這件商品是否已追蹤

    // 共用：打 API，失敗時把後端的 ErrorResponse.message 丟出來
    async function getJson(url) {
        const res = await fetch(url);
        const body = await res.json();
        if (!res.ok) throw new Error(body.message || res.status);
        return body;
    }

    // 畫整個商品區塊；選顏色、選尺寸後都重畫一次
    function render() {
        const p = product;
        const color = p.colors[colorIndex];
        const onSale = p.origPrice != null && p.origPrice > p.price;

        document.getElementById('page').innerHTML = `
            <div class="detail">
                <img src="${color?.imageUrl ?? ''}" alt="${p.name}">
                <div class="info">
                    <h2>${p.name}
                        <button class="wish ${inWishlist ? 'on' : ''}" onclick="toggleWishlist()">${inWishlist ? '♥ 已追蹤' : '♡ 追蹤'}</button>
                    </h2>
                    <div>
                        <span class="price ${onSale ? 'sale' : ''}">NT$${p.price}</span>
                        ${onSale ? `<span class="orig">NT$${p.origPrice}</span>` : ''}
                    </div>
                    ${p.description ? `<p class="desc">${p.description}</p>` : ''}

                    <h4>顏色：${color?.color ?? '無'}</h4>
                    <div class="options">
                        ${p.colors.map((c, i) => `
                            <button class="${i === colorIndex ? 'active' : ''}" onclick="selectColor(${i})">${c.color}</button>
                        `).join('')}
                    </div>

                    <h4>尺寸</h4>
                    <div class="options">
                        ${(color?.sizes ?? []).map(s => `
                            <button class="${s.variantId === selectedSize?.variantId ? 'active' : ''}"
                                    ${s.stock <= 0 ? 'disabled' : ''}
                                    onclick="selectSize(${s.variantId})">${s.size}</button>
                        `).join('')}
                    </div>

                    <div class="selected">
                        ${selectedSize
                            ? `已選：${color.color} / ${selectedSize.size}（庫存 ${selectedSize.stock}，variantId ${selectedSize.variantId}）`
                            : '請選擇尺寸'}
                    </div>
                    <div class="cart-row">
                        <label>數量 <input id="qty" type="number" min="1" value="1"></label>
                        <button class="cart" ${selectedSize ? '' : 'disabled'} onclick="addToCart()">加入購物車</button>
                    </div>
                    <div id="cartMsg"></div>
                </div>
            </div>`;
    }

    // 換顏色：尺寸要重選，因為不同顏色是不同的 SKU
    function selectColor(i) {
        colorIndex = i;
        selectedSize = null;
        render();
    }

    function selectSize(variantId) {
        selectedSize = product.colors[colorIndex].sizes.find(s => s.variantId === variantId);
        render();
    }

    // POST /api/cart   body: { variantId, qty }
    // 成功時後端回 204（沒有 body），所以不能用 getJson（它會呼叫 res.json()）
    async function addToCart() {
        const msg = document.getElementById('cartMsg');
        const qty = Number(document.getElementById('qty').value);
        try {
            // 後端還沒有 @Min(1)，先在前端擋掉 0 和負數
            if (!Number.isInteger(qty) || qty < 1) throw new Error('數量至少要 1');
            const res = await fetch('/api/cart', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ variantId: selectedSize.variantId, qty }),
            });
            if (!res.ok) {
                const body = await res.json();
                throw new Error(body.message || res.status);
            }
            msg.innerHTML = '已加入購物車，<a href="cart.html">前往購物車</a>';
        } catch (e) {
            msg.innerHTML = `<span class="error">${e.message}</span>`;
        }
    }

    // 追蹤 / 取消追蹤：POST 或 DELETE /api/wishlist/{slug}
    // 成功時後端回 204（沒有 body），所以不能用 getJson
    async function toggleWishlist() {
        const msg = document.getElementById('cartMsg');
        try {
            const res = await fetch(`/api/wishlist/${encodeURIComponent(slug)}`, {
                method: inWishlist ? 'DELETE' : 'POST',
            });
            if (!res.ok) {
                const body = await res.json();
                throw new Error(body.message || res.status);
            }
            inWishlist = !inWishlist;
            render();
        } catch (e) {
            msg.innerHTML = `<span class="error">${e.message}</span>`;
        }
    }

    // GET /api/wishlist/{slug}：回傳 true / false
    async function loadWishlistState() {
        inWishlist = await getJson(`/api/wishlist/${encodeURIComponent(slug)}`);
    }

    // GET /api/products/{slug}
    async function main() {
        try {
            if (!slug) throw new Error('網址缺少 slug，例如 product.html?slug=men-487511');
            [product] = await Promise.all([
                getJson(`/api/products/${encodeURIComponent(slug)}`),
                loadWishlistState(),
            ]);
            document.title = product.name;
            render();
        } catch (e) {
            document.getElementById('page').innerHTML = `<span class="error">錯誤：${e.message}</span>`;
        }
    }
    main();
</script>
</body>
</html>

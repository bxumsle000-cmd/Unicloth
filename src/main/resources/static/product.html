<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#F6F5F2">
    <title>商品 — KINU</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/kinu.css">
    <style>
        /* ===== 商品頁專用 ===== */
        .detail { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 6%; align-items: start; }
        .gallery { aspect-ratio: 3/4; background: var(--cream); overflow: hidden; position: sticky; top: 20px; }
        .gallery img { width: 100%; height: 100%; object-fit: cover; mix-blend-mode: multiply; }
        .info { padding-top: 6px; }
        .info h1 { font-size: clamp(22px, 2.4vw, 30px); font-weight: 500; letter-spacing: .05em; line-height: 1.45; margin: 10px 0 14px; }
        .info .price { font-size: 17px; }
        .info .price del { font-size: 13px; }
        .section { padding: 26px 0; border-bottom: 1px solid var(--line); }
        .section:first-of-type { margin-top: 26px; border-top: 1px solid var(--line); }
        .section-label { font-size: 10px; letter-spacing: .18em; color: var(--muted); margin-bottom: 14px; display: flex; justify-content: space-between; }
        .section-label b { color: #000; font-weight: 500; letter-spacing: .06em; }
        .swatches { display: flex; gap: 10px; flex-wrap: wrap; }
        .swatch { width: 58px; aspect-ratio: 3/4; background: var(--cream); border: 1px solid transparent; padding: 2px; }
        .swatch img { width: 100%; height: 100%; object-fit: cover; mix-blend-mode: multiply; display: block; }
        .swatch.active { border-color: #000; }
        .sizes { display: flex; gap: 8px; flex-wrap: wrap; }
        .sizes .chip { min-width: 54px; justify-content: center; height: 38px; }
        .stock-note { font-size: 10px; letter-spacing: .06em; color: #9a3b2d; margin-top: 12px; min-height: 14px; }
        .buy { display: flex; gap: 12px; align-items: center; margin-top: 26px; flex-wrap: wrap; }
        .buy .btn { flex: 1; min-width: 180px; }
        .buy .heart { width: 48px; height: 48px; border: 1px solid var(--line); }
        .buy .heart:hover { border-color: #000; }
        .desc { font-size: 12px; line-height: 2.1; letter-spacing: .04em; color: #36322e; white-space: pre-line; }
        .desc-toggle { display: flex; justify-content: space-between; width: 100%; font-size: 10px; letter-spacing: .18em; color: var(--muted); }
        .desc-body { display: none; margin-top: 16px; }
        .desc-body.open { display: block; }
        @media (max-width: 760px) {
            .detail { grid-template-columns: 1fr; gap: 26px; }
            .gallery { position: static; }
        }
    </style>
</head>
<body>
<div id="site-header"></div>

<main class="page">
    <nav class="breadcrumb"><a href="/">首頁</a><span class="sep">/</span><span id="crumbName">商品</span></nav>
    <div id="content"><div class="state">載入中…</div></div>
</main>

<div id="site-footer"></div>

<script src="/js/kinu.js"></script>
<script src="/js/product.js"></script>
</body>
</html>

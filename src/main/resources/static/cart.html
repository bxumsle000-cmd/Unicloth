<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>購物車（測試用）</title>
    <style>
        body { font-family: sans-serif; margin: 0; color: #222; }
        a { color: inherit; }

        main { padding: 16px 24px; max-width: 900px; }
        .back { display: inline-block; margin-bottom: 12px; }

        .item { display: flex; gap: 16px; padding: 16px 0; border-bottom: 1px solid #ddd; }
        .item img { width: 120px; height: 120px; object-fit: cover; background: #f2f2f2; }
        .item .info { flex: 1; }
        .item .name { font-weight: bold; }
        .item .spec { color: #555; margin: 4px 0; }
        .item .row { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
        .item input { width: 64px; padding: 4px; }
        .item.off { opacity: .6; }

        .price { font-weight: bold; }
        .warn { color: #d00; font-size: 14px; }
        .tag { font-size: 12px; color: #fff; background: #888; padding: 1px 6px; margin-left: 6px; }

        .summary { margin-top: 20px; font-size: 18px; text-align: right; }
        .error { color: #d00; }
    </style>
</head>
<body>

<main>
    <a class="back" href="javascript:history.back()">‹ 回上一頁</a>
    <h2>購物車</h2>
    <p class="error" id="error"></p>
    <div id="list"></div>
    <div class="summary" id="summary"></div>
</main>

<script>
    let items = [];   // API 回傳的 CartItemResponse 陣列

    // 共用：打 API，失敗時把後端的 ErrorResponse.message 丟出來
    // 新增 / 改數量 / 刪除成功時後端回 204（沒有 body），不能呼叫 res.json()
    async function api(url, options = {}) {
        const res = await fetch(url, {
            ...options,
            headers: { 'Content-Type': 'application/json', ...options.headers },
        });
        const body = res.status === 204 ? null : await res.json();
        if (!res.ok) throw new Error(body?.message || res.status);
        return body;
    }

    function showError(message) {
        document.getElementById('error').textContent = message ?? '';
    }

    function render() {
        const list = document.getElementById('list');
        if (items.length === 0) {
            list.innerHTML = '<p>購物車是空的</p>';
            document.getElementById('summary').textContent = '';
            return;
        }

        list.innerHTML = items.map(it => {
            // 下架的商品連不到商品頁，所以不做連結
            const name = it.onSale
                ? `<a href="product.html?slug=${encodeURIComponent(it.slug)}">${it.name}</a>`
                : `${it.name}<span class="tag">已下架</span>`;
            const overStock = it.qty > it.stock;

            return `
                <div class="item ${it.onSale ? '' : 'off'}">
                    <img src="${it.imageUrl ?? ''}" alt="${it.name}">
                    <div class="info">
                        <div class="name">${name}</div>
                        <div class="spec">${it.color} / ${it.size}</div>
                        <div class="price">NT$${it.price}</div>
                        <div class="row">
                            <label>數量
                                <input type="number" min="1" max="${it.stock}" value="${it.qty}"
                                       onchange="changeQty(${it.id}, this.value)">
                            </label>
                            <span>小計 NT$${it.price * it.qty}</span>
                            <button onclick="removeItem(${it.id})">刪除</button>
                        </div>
                        ${overStock ? `<div class="warn">庫存只剩 ${it.stock} 件，請調整數量</div>` : ''}
                    </div>
                </div>`;
        }).join('');

        // 後端沒有回總金額，前端自己加總；下架的不算
        const buyable = items.filter(it => it.onSale);
        const count = buyable.reduce((sum, it) => sum + it.qty, 0);
        const total = buyable.reduce((sum, it) => sum + it.price * it.qty, 0);
        document.getElementById('summary').innerHTML =
            `共 ${count} 件　合計 <span class="price">NT$${total}</span>`;
    }

    // GET /api/cart
    async function load() {
        items = await api('/api/cart');
        render();
    }

    // PATCH /api/cart   body: { cartItemId, qty }
    async function changeQty(cartItemId, value) {
        showError();
        const qty = Number(value);
        try {
            // 後端還沒有 @Min(1)，先在前端擋掉 0 和負數
            if (!Number.isInteger(qty) || qty < 1) throw new Error('數量至少要 1');
            await api('/api/cart', {
                method: 'PATCH',
                body: JSON.stringify({ cartItemId, qty }),
            });
        } catch (e) {
            showError(e.message);
        }
        // 成功或失敗都重抓一次：後端回 204 沒有資料，要重抓才知道最新數量；
        // 失敗時也要把輸入框還原成資料庫裡的數量
        await load();
    }

    // DELETE /api/cart/{cartItemId}
    async function removeItem(cartItemId) {
        showError();
        try {
            await api(`/api/cart/${cartItemId}`, { method: 'DELETE' });
            await load();
        } catch (e) {
            showError(e.message);
        }
    }

    load().catch(e => showError('錯誤：' + e.message));
</script>
</body>
</html>

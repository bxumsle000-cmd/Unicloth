<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#F6F5F2">
    <title>購物車 — KINU</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/kinu.css">
    <style>
        /* ===== 購物車頁專用 ===== */
        .cart { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 5%; align-items: start; margin-top: 34px; }
        .cart-list { border-top: 1px solid var(--line); }
        .cart-item { display: grid; grid-template-columns: 110px minmax(0, 1fr) auto; gap: 22px; padding: 24px 0; border-bottom: 1px solid var(--line); }
        .cart-item .thumb { aspect-ratio: 3/4; background: var(--cream); display: block; overflow: hidden; }
        .cart-item .thumb img { width: 100%; height: 100%; object-fit: cover; mix-blend-mode: multiply; }
        .cart-item .name { font-size: 13px; letter-spacing: .04em; line-height: 1.6; text-decoration: none; }
        .cart-item .name:hover { text-decoration: underline; }
        .cart-item .meta { font-size: 11px; color: var(--muted); letter-spacing: .06em; margin: 6px 0 16px; }
        .cart-item .warn { font-size: 10px; color: #9a3b2d; letter-spacing: .06em; margin-top: 10px; }
        .cart-item .right { display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; gap: 12px; }
        .cart-item .line-total { font-size: 13px; letter-spacing: .05em; }
        .cart-item.off-sale .thumb img { filter: grayscale(1); opacity: .55; }
        .summary { background: #fff; padding: 30px 28px; position: sticky; top: 20px; }
        .summary h2 { font-size: 11px; letter-spacing: .22em; font-weight: 500; margin: 0 0 24px; }
        .sum-row { display: flex; justify-content: space-between; font-size: 12px; letter-spacing: .05em; padding: 7px 0; }
        .sum-row.total { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 18px; font-size: 15px; }
        .ship-note { font-size: 10px; color: var(--muted); letter-spacing: .06em; line-height: 1.8; margin: 8px 0 0; }
        .ship-bar { height: 2px; background: var(--line); margin-top: 10px; }
        .ship-bar i { display: block; height: 100%; background: #000; transition: width .3s; }
        .summary .btn { width: 100%; margin-top: 24px; }
        .summary .later { text-align: center; font-size: 10px; color: var(--muted); letter-spacing: .08em; margin-top: 10px; }
        .sum-row[hidden] { display: none; }     /* .sum-row 的 display:flex 會蓋掉 hidden，要補這行 */
        .coupon-box { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 14px; }
        .coupon-box .sum-row .link-btn { padding: 0; }
        .coupon-opt { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 9px 0; font-size: 12px; letter-spacing: .04em; cursor: pointer; }
        .coupon-opt input { margin: 2px 0 0; accent-color: #000; }
        .coupon-opt .cond { font-size: 10px; color: var(--muted); letter-spacing: .06em; margin-top: 3px; }
        .coupon-opt .off { font-size: 12px; white-space: nowrap; }
        .coupon-opt.disabled { color: #b9b2aa; cursor: not-allowed; }
        .coupon-opt.disabled .off { font-size: 10px; color: var(--muted); }
        .coupon-empty { font-size: 10px; color: var(--muted); letter-spacing: .06em; padding: 4px 0; }
        @media (max-width: 900px) {
            .cart { grid-template-columns: 1fr; }
            .summary { position: static; }
        }
        @media (max-width: 760px) {
            .cart-item { grid-template-columns: 84px minmax(0, 1fr); gap: 14px; }
            .cart-item .right { grid-column: 2; flex-direction: row; align-items: center; }
        }
    </style>
</head>
<body>
<div id="site-header"></div>

<main class="page">
    <div class="page-eyebrow">SHOPPING BAG</div>
    <h1 class="page-title" data-i18n="cart">購物車</h1>
    <div class="page-sub" id="count"></div>
    <div id="content"><div class="state">載入中…</div></div>
</main>

<div id="site-footer"></div>

<script src="/js/kinu.js"></script>
<script>
    const FREE_SHIPPING = 2500;   // 公告列寫的「滿 NT$2,500 免運」
    let items = [];
    let coupons = [];               // 這次小計下，未使用、未過期的券（含未達低消的）
    let selectedCouponId = null;    // 選中的券（MemberCoupon.id），null = 不使用
    let couponRequest = 0;          // 快速連按改數量時，只採用最後一次的查詢結果

    async function load() {
        try {
            items = await api('/api/cart');
            render();
        } catch (e) {
            document.getElementById('content').innerHTML = `<div class="state">${esc(e.message)}</div>`;
        }
    }

    function render() {
        const box = document.getElementById('content');
        const totalQty = items.reduce((sum, it) => sum + it.qty, 0);
        document.getElementById('count').textContent = items.length ? `共 ${totalQty} 件` : '';

        if (items.length === 0) {
            box.innerHTML = '<div class="state">購物車目前是空的。<br><a href="/products.html?category=all_women">去逛逛本季新品</a></div>';
            return;
        }

        // 已下架、或數量超過庫存的品項，不算進金額，也不能結帳
        const valid = items.filter(it => it.onSale && it.qty <= it.stock);
        const subtotal = valid.reduce((sum, it) => sum + it.price * it.qty, 0);
        const remain = Math.max(0, FREE_SHIPPING - subtotal);
        const hasProblem = valid.length !== items.length;

        box.innerHTML = `
            <div class="cart">
                <div class="cart-list">${items.map(itemRow).join('')}</div>
                <aside class="summary">
                    <h2>訂單摘要</h2>
                    <div class="sum-row"><span>商品小計</span><span>${money(subtotal)}</span></div>
                    <div class="sum-row"><span>運費</span><span>${remain === 0 ? '免運' : '結帳時計算'}</span></div>
                    <p class="ship-note">${remain === 0 ? '已達免運門檻' : `再買 ${money(remain)} 即可享免運`}</p>
                    <div class="ship-bar"><i style="width:${Math.min(100, subtotal / FREE_SHIPPING * 100)}%"></i></div>
                    <div class="coupon-box">
                        <div class="sum-row"><span>折價券</span><a class="link-btn" href="/coupons.html">我的折價券</a></div>
                        <div id="couponList"><div class="coupon-empty">載入中…</div></div>
                    </div>
                    <div class="sum-row" id="discountRow" hidden><span>折價券折抵</span><span id="discountAmount"></span></div>
                    <div class="sum-row total"><span>合計</span><span id="totalAmount">${money(subtotal)}</span></div>
                    ${hasProblem ? '<p class="ship-note" style="color:#9a3b2d">部分商品已下架或庫存不足，未計入金額。</p>' : ''}
                    <button class="btn" disabled>前往結帳　→</button>
                    <div class="later">結帳功能即將推出</div>
                </aside>
            </div>`;

        box.querySelectorAll('[data-action]').forEach(btn => btn.addEventListener('click', onAction));
        loadCoupons(subtotal);
    }

    // ---------- 折價券 ----------

    // 小計一變（改數量、移除）就重新問後端：哪些券達到低消、各能折多少
    async function loadCoupons(subtotal) {
        const req = ++couponRequest;
        try {
            const list = subtotal > 0 ? await api('/api/coupon/usable?subtotal=' + subtotal) : [];
            if (req !== couponRequest) return;      // 已經有更新的查詢，這次的結果不要了
            coupons = list;
        } catch (e) {
            if (req !== couponRequest) return;
            coupons = [];
            document.getElementById('couponList').innerHTML = `<div class="coupon-empty">${esc(e.message)}</div>`;
            return updateTotal(subtotal);
        }

        // 原本選的券用掉了、過期了，或小計變少沒達到低消 → 取消選取
        const selected = coupons.find(c => c.id === selectedCouponId);
        if (!selected || !selected.meetsMinSubtotal) selectedCouponId = null;

        renderCoupons(subtotal);
    }

    function renderCoupons(subtotal) {
        const el = document.getElementById('couponList');
        if (coupons.length === 0) {
            el.innerHTML = '<div class="coupon-empty">目前沒有可使用的折價券</div>';
            return updateTotal(subtotal);
        }

        el.innerHTML = couponOption({ id: '', title: '不使用折價券', meetsMinSubtotal: true }, subtotal)
            + coupons.map(c => couponOption(c, subtotal)).join('');
        el.querySelectorAll('input[name="coupon"]').forEach(radio => radio.addEventListener('change', () => {
            selectedCouponId = radio.value ? Number(radio.value) : null;
            updateTotal(subtotal);
        }));
        updateTotal(subtotal);
    }

    function couponOption(c, subtotal) {
        const isNone = c.id === '';
        const checked = isNone ? selectedCouponId === null : c.id === selectedCouponId;
        let right = '';
        if (!isNone) {
            // 未達低消：還是列出來但不能選，提示再買多少
            right = !c.meetsMinSubtotal ? `再買 ${money(c.minSubtotal - subtotal)} 可使用`
                : `−${money(c.discount)}`;
        }
        return `
            <label class="coupon-opt${c.meetsMinSubtotal ? '' : ' disabled'}">
                <input type="radio" name="coupon" value="${c.id}" ${checked ? 'checked' : ''} ${c.meetsMinSubtotal ? '' : 'disabled'}>
                <span>
                    ${esc(c.title)}
                    ${isNone ? '' : `<div class="cond">${couponRuleText(c)}　·　${fmtDate(c.expireAt)} 到期</div>`}
                </span>
                <span class="off">${right}</span>
            </label>`;
    }

    // 合計 = 小計 − 折抵；運費在結帳時才算，這裡先不加
    function updateTotal(subtotal) {
        const coupon = coupons.find(c => c.id === selectedCouponId);
        const discount = coupon ? coupon.discount : 0;
        document.getElementById('discountRow').hidden = discount === 0;
        document.getElementById('discountAmount').textContent = '−' + money(discount);
        document.getElementById('totalAmount').textContent = money(subtotal - discount);
    }

    function itemRow(it) {
        const href = `/product.html?slug=${encodeURIComponent(it.slug)}&color=${encodeURIComponent(it.color)}`;
        const img = it.imageUrl ? `<img src="${esc(imgSrc(it.imageUrl))}" alt="${esc(it.name)}">` : '';
        let warn = '';
        if (!it.onSale) warn = '此商品已下架，請移除';
        else if (it.stock === 0) warn = '已售完，請移除';
        else if (it.qty > it.stock) warn = `庫存只剩 ${it.stock} 件，請調整數量`;

        return `
            <div class="cart-item${it.onSale ? '' : ' off-sale'}">
                ${it.onSale ? `<a class="thumb" href="${href}">${img}</a>` : `<div class="thumb">${img}</div>`}
                <div>
                    ${it.onSale ? `<a class="name" href="${href}">${esc(it.name)}</a>` : `<span class="name">${esc(it.name)}</span>`}
                    <div class="meta">${esc(it.color)}　/　${esc(it.size)}　·　${money(it.price)}</div>
                    ${it.onSale ? `
                    <div class="qty">
                        <button data-action="minus" data-id="${it.id}" ${it.qty <= 1 ? 'disabled' : ''} aria-label="減少">−</button>
                        <span>${it.qty}</span>
                        <button data-action="plus" data-id="${it.id}" ${it.qty >= it.stock ? 'disabled' : ''} aria-label="增加">＋</button>
                    </div>` : ''}
                    ${warn ? `<div class="warn">${warn}</div>` : ''}
                </div>
                <div class="right">
                    <div class="line-total">${money(it.price * it.qty)}</div>
                    <button class="link-btn" data-action="remove" data-id="${it.id}">移除</button>
                </div>
            </div>`;
    }

    async function onAction(e) {
        const btn = e.currentTarget;
        const id = Number(btn.dataset.id);
        const item = items.find(it => it.id === id);
        btn.disabled = true;
        try {
            if (btn.dataset.action === 'remove') {
                await api('/api/cart/' + id, { method: 'DELETE' });
                items = items.filter(it => it.id !== id);
                toast('已從購物車移除');
            } else {
                // 庫存不足時，按減號直接降到庫存上限
                const next = btn.dataset.action === 'plus' ? item.qty + 1
                    : Math.min(item.qty - 1, Math.max(1, item.stock));
                await api('/api/cart', { method: 'PATCH', body: { cartItemId: id, qty: next } });
                item.qty = next;
            }
            render();
            refreshCounts();
        } catch (err) {
            toast(err.message, true);
            load();     // 跟後端重新同步（例如庫存剛被別人買走）
        }
    }

    load();
</script>
</body>
</html>

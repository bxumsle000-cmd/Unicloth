<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#F6F5F2">
    <title>商品列表 — KINU</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/kinu.css">
    <style>
        /* ===== 商品列表頁專用 ===== */
        .list-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; padding-bottom: 24px; border-bottom: 1px solid var(--line); }
        .subcats { display: flex; gap: 8px; flex-wrap: wrap; margin: 24px 0 0; }

        /* 篩選列 */
        .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 18px 0; }
        .toolbar-left { display: flex; gap: 22px; align-items: center; }
        .filter-toggle { font-size: 11px; letter-spacing: .12em; display: inline-flex; align-items: center; gap: 8px; padding: 6px 0; }
        .filter-toggle i { font-style: normal; font-size: 9px; color: var(--muted); }
        .sort { border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 6px 2px; font-size: 11px; letter-spacing: .06em; outline: none; cursor: pointer; }
        .filters { display: none; padding: 6px 0 28px; border-bottom: 1px solid var(--line); margin-bottom: 30px; }
        .filters.open { display: grid; gap: 22px; }
        .filter-row { display: grid; grid-template-columns: 70px 1fr; gap: 14px; align-items: start; }
        .filter-label { font-size: 10px; letter-spacing: .18em; color: var(--muted); padding-top: 9px; }
        .filter-options { display: flex; gap: 8px; flex-wrap: wrap; }
        .price-range { display: flex; align-items: center; gap: 10px; font-size: 11px; }
        .price-range input { width: 100px; height: 32px; padding: 0 10px; border: 1px solid var(--line); background: transparent; outline: none; }
        .price-range input:focus { border-color: #000; }
        .filter-actions { display: flex; gap: 22px; align-items: center; padding-left: 84px; }
        .filter-actions .btn { height: 38px; padding: 0 22px; font-size: 10px; }
        .active-filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 26px; }
        .active-filters .chip { height: 28px; font-size: 10px; gap: 8px; }
        @media (max-width: 760px) {
            .filter-row { grid-template-columns: 1fr; gap: 8px; }
            .filter-label { padding-top: 0; }
            .filter-actions { padding-left: 0; }
        }
    </style>
</head>
<body>
<div id="site-header"></div>

<main class="page">
    <nav class="breadcrumb" id="breadcrumb"></nav>

    <div class="list-head">
        <div>
            <div class="page-eyebrow" id="eyebrow">COLLECTION</div>
            <h1 class="page-title" id="title">&nbsp;</h1>
            <div class="page-sub" id="total"></div>
        </div>
    </div>

    <!-- 下一層分類（分類模式才有） -->
    <div class="subcats" id="subcats"></div>

    <div class="toolbar">
        <div class="toolbar-left">
            <button class="filter-toggle" id="filterToggle" hidden>篩選 <i id="filterCount"></i> <span id="filterArrow">＋</span></button>
        </div>
        <select class="sort" id="sort" aria-label="排序">
            <option value="id,desc">最新上架</option>
            <option value="price,asc">價格：低到高</option>
            <option value="price,desc">價格：高到低</option>
        </select>
    </div>

    <!-- 篩選面板（分類模式才有） -->
    <div class="filters" id="filters">
        <div class="filter-row">
            <div class="filter-label">顏色</div>
            <div class="filter-options" id="colorOptions"></div>
        </div>
        <div class="filter-row">
            <div class="filter-label">尺寸</div>
            <div class="filter-options" id="sizeOptions"></div>
        </div>
        <div class="filter-row">
            <div class="filter-label">價格</div>
            <div class="price-range">
                <input type="number" min="0" step="100" id="minPrice" placeholder="最低">
                <span>—</span>
                <input type="number" min="0" step="100" id="maxPrice" placeholder="最高">
            </div>
        </div>
        <div class="filter-actions">
            <button class="btn" id="applyPrice">套用價格</button>
            <button class="link-btn" id="clearFilters">清除全部篩選</button>
        </div>
    </div>

    <div class="active-filters" id="activeFilters"></div>

    <div class="product-grid" id="grid"></div>
    <div class="pager" id="pager"></div>
</main>

<div id="site-footer"></div>

<script src="/js/kinu.js"></script>
<script src="/js/products.js"></script>
</body>
</html>
